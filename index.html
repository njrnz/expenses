<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="theme-color" content="#F2F1EC">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Expenses</title>
  <style>
    :root {
      --bg:     #F2F1EC;
      --surf:   #FFFFFF;
      --surf2:  #EBE9E1;
      --border: #DDDAD0;
      --text:   #1A1A1F;
      --muted:  #6E6E78;
      --p1:     #2F6FED;
      --p2:     #8A3FEF;
      --green:  #15915F;
      --amber:  #B45309;
      --red:    #C22B3A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); }
    body { font-family: system-ui, -apple-system, sans-serif; color: var(--text); }
    input, button { font-family: inherit; outline: none; -webkit-appearance: none; }
    input::placeholder { color: #C6C3B8; }
    ::-webkit-scrollbar { display: none; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeup  { from { opacity:0;transform:translateY(-8px); } to { opacity:1;transform:translateY(0); } }
    @keyframes slidein { from { transform:translateY(100%); } to { transform:translateY(0); } }
    @keyframes pulse   { 0%,100%{opacity:.4} 50%{opacity:1} }
    @keyframes tabfade { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
    @keyframes dropopen { from{opacity:0;transform:translateY(-6px) scaleY(.96);transform-origin:top;} to{opacity:1;transform:translateY(0) scaleY(1);} }
    @keyframes amtpop  { 0%{opacity:.3;transform:scale(.94);} 60%{transform:scale(1.02);} 100%{opacity:1;transform:scale(1);} }
    .tab-anim  { animation: tabfade .28s cubic-bezier(.2,.8,.2,1); }
    .amt-anim  { display:inline-block; animation: amtpop .3s cubic-bezier(.2,.8,.2,1); }

    .row:last-child       { border-bottom: none !important; }
    .sugg-row:last-child  { border-bottom: none !important; }
    .sugg-row:active      { background: var(--surf2) !important; }
    .rec-row:last-child   { border-bottom: none !important; }
    .rec-row:active       { background: var(--surf2) !important; }
    .cat-btn:active       { transform: scale(.93); }
    .btn-name:active      { transform: scale(.97); }
    .add-btn:active       { transform: scale(.98); }
    .tab-btn:active       { opacity: .5; }
    .budget-row:active    { background: var(--surf2) !important; }
    .quick-card:active    { transform: scale(.96); }

    #boot { display:flex;justify-content:center;align-items:center;height:100vh; }
    #boot .sp { width:28px;height:28px;border-radius:50%;border:3px solid #DDDAD0;border-top-color:#2F6FED;animation:spin .7s linear infinite; }
  </style>
</head>
<body>
<div id="root"><div id="boot"><div class="sp"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDSnrvUcXuOvF3f4uR4RLNt_ZunntQaFBA",
  authDomain:        "nick-puai-expenses.firebaseapp.com",
  databaseURL:       "https://nick-puai-expenses-default-rtdb.firebaseio.com",
  projectId:         "nick-puai-expenses",
  storageBucket:     "nick-puai-expenses.firebasestorage.app",
  messagingSenderId: "610510764626",
  appId:             "1:610510764626:web:0b15a873a383667be33d8b"
};
const DEFAULT_NAMES = { p1: "Nick", p2: "Puai" };

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

// ═══════════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════════
const CATS = [
  { id:"housing",       label:"Housing",      emoji:"🏠", color:"#8FA3D9", noSplit:true },
  { id:"groceries",     label:"Groceries",    emoji:"🛒", color:"#34D399" },
  { id:"dining_fun",    label:"Dining & Fun", emoji:"🎉", color:"#FB923C" },
  { id:"bills",         label:"Bills",        emoji:"🧾", color:"#60A5FA" },
  { id:"subscriptions", label:"Subs",         emoji:"📱", color:"#F472B6" },
  { id:"other",         label:"Other",        emoji:"🏷️", color:"#94A3B8" },
];
const FREQS = [
  { id:"once",       label:"One-off"     },
  { id:"weekly",     label:"↻ Weekly"    },
  { id:"fortnightly",label:"↻ Fortnight" },
  { id:"monthly",    label:"↻ Monthly"   },
];
const catById = id => {
  if (id === "dining" || id === "entertainment") return CATS.find(c => c.id === "dining_fun");
  if (id === "transport" || id === "health" || id === "shopping") return CATS.find(c => c.id === "other");
  if (id === "rent") return CATS.find(c => c.id === "housing");
  if (id === "utilities" || id === "insurance") return CATS.find(c => c.id === "bills");
  return CATS.find(c => c.id === id) || CATS[CATS.length - 1];
};

// ═══════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════
const weekOf = (d = new Date()) => {
  const dt = new Date(d); dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate() - ((dt.getDay()-4+7)%7));
  return dt.toISOString();
};
const curMo   = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`; };
const prevMo  = m => { const [y,mo]=m.split("-").map(Number); return mo===1?`${y-1}-12`:`${y}-${String(mo-1).padStart(2,"0")}`; };
const nextMo  = m => { const [y,mo]=m.split("-").map(Number); return mo===12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,"0")}`; };
const moLabel = m => { const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString("en-NZ",{month:"long",year:"numeric"}); };
const shortMo = m => { const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString("en-NZ",{month:"short"}); };
const moExps  = (exps,m) => exps.filter(e=>e.ts&&e.ts.startsWith(m));
const last6Months = () => { const out=[]; let m=curMo(); for(let i=0;i<6;i++){out.unshift(m);m=prevMo(m);} return out; };
const yearOf = iso => iso.slice(0,4);

const nzd       = n   => new Intl.NumberFormat("en-NZ",{style:"currency",currency:"NZD"}).format(Math.abs(n));
const shortDate = iso => new Date(iso).toLocaleDateString("en-NZ",{weekday:"short",month:"short",day:"numeric"});
const longDate  = iso => new Date(iso).toLocaleDateString("en-NZ",{weekday:"long",day:"numeric",month:"long"});
const getBal    = exps => exps.reduce((a,e)=>a+(e.by==="p1"?e.amt/2:-e.amt/2),0);
const splittable = exps => exps.filter(e => !catById(e.category||"other").noSplit);
// Settlements: p2 paying p1 reduces positive balance; p1 paying p2 increases it
const getSettleBal = ss => ss.reduce((a,s)=>a+(s.from==="p2"?-s.amt:s.amt),0);

const pct      = (spent,budget) => budget>0 ? Math.min(Math.round((spent/budget)*100),100) : 0;
const monthlyEquiv = (amt,freq) => freq==="weekly"?amt*(52/12):freq==="fortnightly"?amt*(26/12):amt;
const weeklyEquiv  = (amt,freq) => freq==="monthly"?amt*(12/52):freq==="fortnightly"?amt/2:amt;
// Income history: supports old single-object format (treated as always-applicable) and new dated-array format
const incomeHist = (income,who) => {
  const v = income[who];
  if (!v) return [];
  return Array.isArray(v) ? v : [{...v, from:"2000-01-01T00:00:00.000Z"}];
};
const incomeAt = (income,who,dateISO) => {
  const hist = incomeHist(income,who).filter(r=>r.from<=dateISO).sort((a,b)=>b.from.localeCompare(a.from));
  return hist[0] || null;
};
const barColor = p => p>=100?"var(--red)":p>=80?"var(--amber)":"var(--green)";

// ═══════════════════════════════════════════════════════════════
//  LOGIN SCREEN
// ═══════════════════════════════════════════════════════════════
function LoginScreen() {
  const [email, setEmail] = useState("");
  const [pass,  setPass]  = useState("");
  const [err,   setErr]   = useState("");
  const [busy,  setBusy]  = useState(false);

  async function doLogin(e) {
    e.preventDefault();
    setErr(""); setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), pass);
    } catch (ex) {
      setBusy(false);
      if (ex.code === "auth/invalid-credential" || ex.code === "auth/wrong-password" || ex.code === "auth/user-not-found") {
        setErr("Wrong email or password");
      } else if (ex.code === "auth/invalid-email") {
        setErr("That doesn't look like a valid email");
      } else if (ex.code === "auth/too-many-requests") {
        setErr("Too many attempts — wait a bit and try again");
      } else {
        setErr("Couldn't sign in — check your connection");
      }
    }
  }

  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:24}}>
      <form onSubmit={doLogin} style={{width:"100%",maxWidth:340}}>
        <div style={{textAlign:"center",marginBottom:36}}>
          <div style={{fontSize:44,marginBottom:14}}>🔒</div>
          <div style={{fontSize:26,fontWeight:800,color:"var(--text)",letterSpacing:"-0.5px"}}>Expenses</div>
          <div style={{fontSize:14,color:"var(--muted)",marginTop:6}}>Sign in to continue</div>
        </div>

        <div style={{fontSize:11,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Email</div>
        <input type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" autoFocus
          style={{width:"100%",border:"2px solid var(--border)",borderRadius:16,padding:"15px 18px",fontSize:16,marginBottom:14,color:"var(--text)",background:"var(--surf)"}}/>

        <div style={{fontSize:11,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Password</div>
        <input type="password" autoComplete="current-password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••"
          style={{width:"100%",border:"2px solid var(--border)",borderRadius:16,padding:"15px 18px",fontSize:16,marginBottom:18,color:"var(--text)",background:"var(--surf)"}}/>

        {err && <div style={{background:"#FCEBEC",border:"1.5px solid #F2C7CC",borderRadius:14,padding:"12px 16px",fontSize:13,color:"var(--red)",marginBottom:18,fontWeight:600}}>{err}</div>}

        <button type="submit" disabled={busy||!email||!pass}
          style={{width:"100%",background:(busy||!email||!pass)?"var(--surf2)":"var(--p1)",color:(busy||!email||!pass)?"var(--muted)":"#fff",border:"none",borderRadius:18,padding:"17px 0",fontSize:17,fontWeight:800,cursor:(busy||!email||!pass)?"default":"pointer"}}>
          {busy?"Signing in…":"Sign in"}
        </button>

        <div style={{fontSize:12,color:"var(--muted)",textAlign:"center",marginTop:20,lineHeight:1.6}}>
          Stays signed in on this device.<br/>You'll only need to do this once.
        </div>
      </form>
    </div>
  );
}


function App() {
  // ── Auth ────────────────────────────────────────────────────
  const [user,       setUser]       = useState(undefined); // undefined = checking, null = logged out
  const [signingOut, setSigningOut] = useState(false);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => setUser(u));
    return unsub;
  }, []);

  // ── Persisted data ──────────────────────────────────────────
  const [exps,        setExps]       = useState([]);
  const [settlements, setSettlements]= useState([]);
  const [names,       setNames]      = useState(DEFAULT_NAMES);
  const [budgets,     setBudgets]    = useState({});
  const [income,      setIncome]     = useState({});
  const [buffer,      setBuffer]     = useState(null);
  const [sideIncome,  setSideIncome] = useState([]);
  const [loading,     setLoading]    = useState(true);
  const [syncing,     setSyncing]    = useState(false);

  // ── Navigation ──────────────────────────────────────────────
  const [tab,       setTab]      = useState("add");
  const [budgetMo,  setBudgetMo] = useState(curMo());
  const [viewWeekOffset, setViewWeekOffset] = useState(0);

  // ── Add form ────────────────────────────────────────────────
  const [by,    setBy]    = useState(null);
  const [amt,   setAmt]   = useState("");
  const [cat,   setCat]   = useState(null);
  const [where, setWhere] = useState("");
  const [note,  setNote]  = useState("");
  const [freq,  setFreq]  = useState("once");
  const [unexpected, setUnexpected] = useState(false);
  const [wFocus,setWFocus]= useState(false);
  const [showRecurring,setShowRecurring]= useState(false);

  // ── UI state ────────────────────────────────────────────────
  const [toast,       setToast]      = useState(null);
  const [modal,       setModal]      = useState(null);
  const [draftNames,  setDraftNames] = useState({p1:"",p2:""});
  const [draftBudget, setDraftBudget]= useState("");
  const [draftIncome,  setDraftIncome]= useState({amt:"",freq:"monthly"});
  const [draftBuffer,  setDraftBuffer]= useState("");
  const [editDraft,    setEditDraft]  = useState(null);
  const [draftSide,    setDraftSide]  = useState({by:"p1",amt:"",note:""});
  const [draftSettle, setDraftSettle]= useState("");

  const amtRef   = useRef(null);
  const whereRef = useRef(null);

  // ── Firebase real-time listener ──────────────────────────────
  useEffect(() => {
    if (!user) { setLoading(false); return; }
    const ref = db.ref("/tracker-32ae945b1ea1512a226cd186");
    ref.on("value", snap => {
      const d = snap.val() || {};
      setExps((d.expenses||[]).sort((a,b)=>b.ts.localeCompare(a.ts)));
      setSettlements((d.settlements||[]).sort((a,b)=>b.ts.localeCompare(a.ts)));
      if (d.names)   setNames(d.names);
      if (d.budgets) setBudgets(d.budgets);
      if (d.income)  setIncome(d.income);
      if (d.buffer)  setBuffer(d.buffer);
      if (d.sideIncome) setSideIncome(d.sideIncome);
      setLoading(false); setSyncing(false);
    }, () => setLoading(false));
    return () => ref.off();
  }, [user]);

  const persist = useCallback(async (e, n, b, s, inc, buf, side) => {
    setSyncing(true);
    try { await db.ref("/tracker-32ae945b1ea1512a226cd186").set({ expenses:e, names:n, budgets:b, settlements:s, income:inc, buffer:buf, sideIncome:side }); }
    catch { toast_("Couldn't save — check connection", true); setSyncing(false); }
  }, []);

  const toast_ = (msg, err=false) => { setToast({msg,err}); setTimeout(()=>setToast(null),2400); };

  // ── Autocomplete ─────────────────────────────────────────────
  const suggs = useMemo(() => {
    const f={};
    exps.forEach(e=>{ if(e.where&&e.where!=="Unspecified") f[e.where]=(f[e.where]||0)+1; });
    return Object.entries(f).sort((a,b)=>b[1]-a[1]).map(([place,count])=>({place,count}));
  }, [exps]);

  const filtSuggs = useMemo(() => {
    if (!wFocus) return [];
    if (!where.trim()) return suggs.slice(0,5);
    const q = where.toLowerCase();
    return suggs.filter(s=>s.place.toLowerCase().includes(q)&&s.place.toLowerCase()!==q).slice(0,5);
  }, [where, wFocus, suggs]);

  // ── Derived values ───────────────────────────────────────────
  const thisW     = weekOf();
  const lastW     = weekOf(new Date(Date.now()-7*86400000));
  const isThur    = new Date().getDay()===4;
  const thisWExps = exps.filter(e=>e.week===thisW);
  const lastWExps = exps.filter(e=>e.week===lastW);
  const thisWSettl= settlements.filter(s=>s.week===thisW);
  const viewW     = weekOf(new Date(Date.now() + viewWeekOffset*7*86400000));
  const viewWExps = exps.filter(e=>e.week===viewW);
  const viewWSettl= settlements.filter(s=>s.week===viewW);
  const viewWSide = sideIncome.filter(s=>s.week===viewW);
  const viewWBal  = getBal(splittable(viewWExps));
  const bmoExps   = moExps(exps, budgetMo);
  const lastMoExp = moExps(exps, prevMo(budgetMo));

  // Balance includes settlements
  const expBal   = getBal(splittable(exps));
  const settlBal = getSettleBal(settlements);
  const totalBal = expBal + settlBal;
  const weekBal  = getBal(splittable(thisWExps));
  const lastBal  = getBal(splittable(lastWExps));

  const aC   = by==="p1"?"var(--p1)":by==="p2"?"var(--p2)":"var(--text)";
  const aHex = by==="p1"?"#2F6FED":by==="p2"?"#8A3FEF":"#1A1A1F";

  const balLabel = b => {
    if (Math.abs(b)<0.01) return "All square ✓";
    return `${b>0?names.p2:names.p1} owes ${b>0?names.p1:names.p2}`;
  };

  const catTotals = expList => {
    const t={};
    expList.forEach(e=>{ const c=e.category||"other"; t[c]=(t[c]||0)+e.amt; });
    return CATS.filter(c=>t[c.id]).map(c=>({...c,total:t[c.id]})).sort((a,b)=>b.total-a.total);
  };

  const recurringItems = useMemo(()=>{
    const seen={};
    exps.filter(e=>e.frequency&&e.frequency!=="once").forEach(e=>{
      const k=`${e.category||"other"}|${e.where}|${e.frequency}|${e.by}`;
      if(!seen[k]||e.ts>seen[k].ts) seen[k]=e;
    });
    return Object.values(seen).map(e=>({
      ...e, monthlyAmt:e.frequency==="weekly"?e.amt*(52/12):e.frequency==="fortnightly"?e.amt*(26/12):e.amt
    })).sort((a,b)=>b.monthlyAmt-a.monthlyAmt);
  },[exps]);

  // ── Actions ──────────────────────────────────────────────────
  async function addExp() {
    if (!by) return toast_("Tap who paid first",true);
    const v=parseFloat(amt);
    if (!v||v<=0) return toast_("Enter a valid amount",true);
    const exp={id:String(Date.now()),ts:new Date().toISOString(),amt:v,where:where.trim()||"Unspecified",by,week:thisW,category:cat||"other",frequency:freq,note:note.trim()||null,unexpected:unexpected};
    const ne=[exp,...exps];
    setAmt(""); setWhere(""); setCat(null); setFreq("once"); setNote(""); setWFocus(false); setUnexpected(false);
    toast_(`${nzd(v)} added ✓`);
    await persist(ne,names,budgets,settlements,income,buffer,sideIncome);
  }

  async function delExp(id) {
    const ne=exps.filter(e=>e.id!==id); setModal(null);
    await persist(ne,names,budgets,settlements,income,buffer,sideIncome);
  }

  function startEdit(exp) {
    setEditDraft({
      id: exp.id, by: exp.by, amt: String(exp.amt), category: exp.category||"other",
      where: exp.where==="Unspecified"?"":exp.where, note: exp.note||"",
      frequency: exp.frequency||"once", unexpected: !!exp.unexpected
    });
    setModal({type:"edit"});
  }

  async function saveEdit() {
    const v = parseFloat(editDraft.amt);
    if (!v||v<=0) return toast_("Enter a valid amount",true);
    const ne = exps.map(e => e.id===editDraft.id
      ? {...e, by:editDraft.by, amt:v, category:editDraft.category, where:editDraft.where.trim()||"Unspecified", note:editDraft.note.trim()||null, frequency:editDraft.frequency, unexpected:editDraft.unexpected}
      : e
    );
    setModal(null); toast_("Expense updated ✓");
    await persist(ne,names,budgets,settlements,income,buffer,sideIncome);
  }

  async function saveNames() {
    const nn={p1:draftNames.p1.trim()||names.p1, p2:draftNames.p2.trim()||names.p2};
    setModal(null); toast_("Names saved ✓");
    await persist(exps,nn,budgets,settlements,income,buffer,sideIncome);
  }

  function exportCSV() {
    const rows = [["Date","Amount","Category","Where","Paid By","Frequency","Unexpected","Note"]];
    [...exps].sort((a,b)=>a.ts.localeCompare(b.ts)).forEach(e=>{
      const c = catById(e.category||"other");
      rows.push([
        new Date(e.ts).toLocaleDateString("en-NZ"),
        e.amt.toFixed(2),
        c.label,
        e.where||"",
        e.by==="p1"?names.p1:names.p2,
        e.frequency||"once",
        e.unexpected?"yes":"no",
        (e.note||"").replace(/"/g,'""')
      ]);
    });
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `expenses-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast_("CSV downloaded ✓");
  }

  async function saveBudget(catId) {
    const v=parseFloat(draftBudget);
    if(!v||v<=0){setModal(null);return;}
    const nb={...budgets,[catId]:v}; setBudgets(nb); setModal(null); toast_("Budget saved ✓");
    await persist(exps,names,nb,settlements,income,buffer,sideIncome);
  }

  async function saveIncome(who) {
    const v=parseFloat(draftIncome.amt);
    if(!v||v<=0){setModal(null);return;}
    const hist = incomeHist(income,who);
    const ni={...income,[who]:[...hist,{amt:v,freq:draftIncome.freq,from:new Date().toISOString()}]};
    setIncome(ni); setModal(null); toast_("Income updated ✓");
    await persist(exps,names,budgets,settlements,ni,buffer,sideIncome);
  }

  async function saveBuffer() {
    const v=parseFloat(draftBuffer);
    if(!v||v<=0){setModal(null);return;}
    const nbuf={amt:v}; setBuffer(nbuf); setModal(null); toast_("Buffer target saved ✓");
    await persist(exps,names,budgets,settlements,income,nbuf,sideIncome);
  }

  async function addSideIncome() {
    const v=parseFloat(draftSide.amt);
    if(!v||v<=0) return toast_("Enter a valid amount",true);
    const entry={id:String(Date.now()),ts:new Date().toISOString(),amt:v,by:draftSide.by,note:draftSide.note.trim()||null,week:weekOf()};
    const ns=[entry,...sideIncome];
    setSideIncome(ns); setModal(null); toast_(`${nzd(v)} side hustle logged ✓`);
    await persist(exps,names,budgets,settlements,income,buffer,ns);
  }

  async function delSideIncome(id) {
    const ns=sideIncome.filter(s=>s.id!==id); setModal(null);
    await persist(exps,names,budgets,settlements,income,buffer,ns);
  }

  async function settleUp() {
    const v=parseFloat(draftSettle);
    if(!v||v<=0){setModal(null);return;}
    const debtor   = totalBal>0?"p2":"p1";
    const creditor = totalBal>0?"p1":"p2";
    const s={id:String(Date.now()),ts:new Date().toISOString(),amt:v,from:debtor,to:creditor,week:thisW};
    const ns=[s,...settlements];
    setModal(null); toast_(`Settled up ${nzd(v)} ✓`);
    await persist(exps,names,budgets,ns,income,buffer,sideIncome);
  }

  // ── Shared style constants ────────────────────────────────────
  const S = {
    card:  {background:"var(--surf)",borderRadius:20,border:"1.5px solid var(--border)"},
    lbl:   {fontSize:11,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10,display:"block"},
    page:  {padding:"28px 20px 0"},
    title: {fontSize:27,fontWeight:800,letterSpacing:"-0.7px",color:"var(--text)",marginBottom:4},
    opt:   {textTransform:"none",letterSpacing:0,fontWeight:400,fontSize:11},
  };

  if (user === undefined) return (
    <div style={{display:"flex",justifyContent:"center",alignItems:"center",height:"100vh"}}>
      <div style={{width:28,height:28,borderRadius:14,border:"3px solid var(--border)",borderTopColor:"var(--p1)",animation:"spin .7s linear infinite"}}/>
    </div>
  );

  if (user === null) return <LoginScreen/>;

  if (loading) return (
    <div style={{display:"flex",justifyContent:"center",alignItems:"center",height:"100vh"}}>
      <div style={{width:28,height:28,borderRadius:14,border:"3px solid var(--border)",borderTopColor:"var(--p1)",animation:"spin .7s linear infinite"}}/>
    </div>
  );

  // ════════════════════════════════════════════════════════════
  return (
    <div style={{background:"var(--bg)",minHeight:"100vh",maxWidth:430,margin:"0 auto",paddingBottom:90}}>

      {/* Sync bar */}
      {syncing && <div style={{position:"fixed",top:0,left:0,right:0,height:3,background:"var(--p1)",zIndex:9999,animation:"pulse 1.4s ease infinite"}}/>}

      {/* Toast */}
      {toast && <div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",background:toast.err?"var(--red)":"#1A1A2E",color:"#fff",borderRadius:99,padding:"11px 22px",fontSize:14,fontWeight:600,zIndex:9999,animation:"fadeup .2s ease",whiteSpace:"nowrap",boxShadow:"0 8px 30px rgba(0,0,0,.4)",pointerEvents:"none"}}>{toast.msg}</div>}

      {/* ── MODAL: Delete ── */}
      {modal?.type==="delete" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:500,display:"flex",alignItems:"flex-end"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"var(--surf)",width:"100%",maxWidth:430,margin:"0 auto",borderRadius:"24px 24px 0 0",padding:"20px 24px 52px",animation:"slidein .25s ease"}}>

            <div style={{fontSize:14,color:"var(--muted)",marginBottom:24}}>This can't be undone.</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <button onClick={()=>setModal(null)} style={{padding:16,background:"var(--surf2)",border:"none",borderRadius:16,fontSize:16,fontWeight:600,cursor:"pointer",color:"var(--text)"}}>Cancel</button>
              <button onClick={()=>modal.kind==="side"?delSideIncome(modal.id):delExp(modal.id)} style={{padding:16,background:"var(--red)",color:"#fff",border:"none",borderRadius:16,fontSize:16,fontWeight:600,cursor:"pointer"}}>Delete</button>
            </div>

        </div>

      {/* ── MODAL: Edit expense ── */}
      {modal?.type==="edit" && editDraft && (()=>{

        return (
          <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:500,display:"flex",alignItems:"flex-end"}}>

              <div style={{fontSize:20,fontWeight:800,marginBottom:18}}>Edit expense</div>

              <span style={{...S.lbl,marginBottom:8}}>Who paid?</span>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
                {[["p1",names.p1,"var(--p1)"],["p2",names.p2,"var(--p2)"]].map(([k,label,cv])=>(
                  <button key={k} onClick={()=>setEditDraft({...editDraft,by:k})}
                    style={{padding:"14px 10px",background:editDraft.by===k?cv:"var(--surf2)",color:editDraft.by===k?"#fff":"var(--text)",border:"none",borderRadius:14,cursor:"pointer",fontSize:16,fontWeight:700}}>
                    {label}
                  </button>

              </div>

              <span style={{...S.lbl,marginBottom:8}}>Amount</span>
              <div style={{display:"flex",alignItems:"center",gap:6,background:"var(--surf2)",borderRadius:14,padding:"10px 16px",marginBottom:16,border:`2px solid ${eC}`}}>
                <span style={{fontSize:22,color:eC,fontWeight:300}}>$</span>
                <input type="text" inputMode="decimal" value={editDraft.amt} onChange={e=>setEditDraft({...editDraft,amt:e.target.value.replace(/[^0-9.]/g,"")})}
                  style={{fontSize:26,fontWeight:800,border:"none",background:"none",width:"100%",color:eC}}/>
              </div>

              <span style={{...S.lbl,marginBottom:8}}>Category</span>

                    <span style={{fontSize:10.5,fontWeight:editDraft.category===c.id?700:500,color:editDraft.category===c.id?c.color:"var(--muted)"}}>{c.label}</span>

              </div>

              <span style={{...S.lbl,marginBottom:8}}>Note</span>
              <input type="text" value={editDraft.note} onChange={e=>setEditDraft({...editDraft,note:e.target.value})}

              </div>

              </button>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <button onClick={()=>{setModal({type:"delete",id:editDraft.id});}} style={{padding:15,background:"var(--surf2)",border:"none",borderRadius:16,fontSize:15,fontWeight:600,cursor:"pointer",color:"var(--red)"}}>Delete</button>
                <button onClick={saveEdit} style={{padding:15,background:eC,color:"#fff",border:"none",borderRadius:16,fontSize:16,fontWeight:800,cursor:"pointer"}}>Save changes</button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* ── MODAL: Edit names ── */}
      {modal?.type==="settings" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:500,display:"flex",alignItems:"flex-end"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"var(--surf)",width:"100%",maxWidth:430,margin:"0 auto",borderRadius:"24px 24px 0 0",padding:"16px 24px 52px",animation:"slidein .25s ease"}}>

            <div style={{fontSize:14,color:"var(--muted)",marginBottom:22,lineHeight:1.5}}>Change the names shown on buttons and summaries.</div>
            <div style={{...S.lbl,marginBottom:8}}>Your name</div>
            <input value={draftNames.p1} onChange={e=>setDraftNames({...draftNames,p1:e.target.value})} placeholder={names.p1} autoFocus

            <div style={{...S.lbl,marginBottom:8}}>Partner's name</div>

            <button onClick={saveNames} style={{width:"100%",background:"var(--p1)",color:"#fff",border:"none",borderRadius:18,padding:"18px 0",fontSize:18,fontWeight:800,cursor:"pointer",marginBottom:12}}>Save names</button>
            <button onClick={exportCSV} style={{width:"100%",background:"var(--surf2)",color:"var(--text)",border:"none",borderRadius:16,padding:"14px 0",fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1={12} y1={15} x2={12} y2={3}/></svg>
              Export data (CSV)
            </button>
            <button onClick={()=>{setSigningOut(true);auth.signOut();}} style={{width:"100%",background:"none",color:"var(--muted)",border:"none",padding:"10px 0",fontSize:14,fontWeight:600,cursor:"pointer"}}>
              {signingOut?"Signing out…":`Sign out (${user?.email||""})`}
            </button>
          </div>
        </div>
      )}

      {/* ── MODAL: Set budget ── */}
      {modal?.type==="budget" && (()=>{
        const c=catById(modal.catId);
        return (
          <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:500,display:"flex",alignItems:"flex-end"}}>
            <div onClick={e=>e.stopPropagation()} style={{background:"var(--surf)",width:"100%",maxWidth:430,margin:"0 auto",borderRadius:"24px 24px 0 0",padding:"16px 24px 52px",animation:"slidein .25s ease"}}>
              <div style={{width:36,height:4,background:"var(--border)",borderRadius:2,margin:"0 auto 24px"}}/>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
                <div style={{width:44,height:44,borderRadius:14,background:`${c.color}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{c.emoji}</div>
                <div>
                  <div style={{fontSize:20,fontWeight:800}}>{c.label}</div>
                  <div style={{fontSize:13,color:"var(--muted)"}}>Monthly budget</div>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--surf2)",borderRadius:16,padding:"14px 18px",marginBottom:18,border:"2px solid var(--border)"}}>
                <span style={{fontSize:26,color:"var(--muted)",fontWeight:300}}>$</span>
                <input type="text" inputMode="decimal" placeholder="0.00" value={draftBudget} onChange={e=>setDraftBudget(e.target.value.replace(/[^0-9.]/g,""))} autoFocus
                  style={{fontSize:32,fontWeight:800,border:"none",background:"none",width:"100%",color:"var(--text)",letterSpacing:"-1px"}}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:budgets[modal.catId]?"1fr 1fr":"1fr",gap:10}}>
                {budgets[modal.catId] && <button onClick={()=>{const nb={...budgets};delete nb[modal.catId];setBudgets(nb);persist(exps,names,nb,settlements,income,buffer,sideIncome);setModal(null);}} style={{padding:16,background:"var(--surf2)",border:"none",borderRadius:16,fontSize:15,fontWeight:600,cursor:"pointer",color:"var(--red)"}}>Remove</button>}
                <button onClick={()=>saveBudget(modal.catId)} style={{padding:16,background:c.color,color:"#000",border:"none",borderRadius:16,fontSize:16,fontWeight:800,cursor:"pointer"}}>Save budget</button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* ── MODAL: Set income ── */}
      {modal?.type==="income" && (()=>{
        const who = modal.who;
        const label = who==="p1"?names.p1:names.p2;
        const cv = who==="p1"?"var(--p1)":"var(--p2)";
        return (
          <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:500,display:"flex",alignItems:"flex-end"}}>
            <div onClick={e=>e.stopPropagation()} style={{background:"var(--surf)",width:"100%",maxWidth:430,margin:"0 auto",borderRadius:"24px 24px 0 0",padding:"16px 24px 52px",animation:"slidein .25s ease"}}>
              <div style={{width:36,height:4,background:"var(--border)",borderRadius:2,margin:"0 auto 24px"}}/>
              <div style={{fontSize:20,fontWeight:800,marginBottom:4,color:cv}}>{label}'s income</div>
              <div style={{fontSize:13,color:"var(--muted)",marginBottom:20,lineHeight:1.5}}>Changes apply from today onward — past weeks and months keep whatever rate was true at the time.</div>
              <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--surf2)",borderRadius:16,padding:"14px 18px",marginBottom:14,border:"2px solid var(--border)"}}>
                <span style={{fontSize:26,color:"var(--muted)",fontWeight:300}}>$</span>
                <input type="text" inputMode="decimal" placeholder="0.00" value={draftIncome.amt} onChange={e=>setDraftIncome({...draftIncome,amt:e.target.value.replace(/[^0-9.]/g,"")})} autoFocus
                  style={{fontSize:32,fontWeight:800,border:"none",background:"none",width:"100%",color:"var(--text)",letterSpacing:"-1px"}}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:20}}>
                {[["weekly","Weekly"],["fortnightly","Fortnight"],["monthly","Monthly"]].map(([id,l])=>(
                  <button key={id} onClick={()=>setDraftIncome({...draftIncome,freq:id})}
                    style={{padding:"11px 4px",background:draftIncome.freq===id?"var(--surf2)":"none",border:`2px solid ${draftIncome.freq===id?cv:"var(--border)"}`,borderRadius:13,cursor:"pointer",fontSize:12.5,fontWeight:draftIncome.freq===id?700:500,color:draftIncome.freq===id?cv:"var(--muted)"}}>
                    {l}
                  </button>
                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:income[who]?"1fr 1fr":"1fr",gap:10}}>
                {income[who] && <button onClick={()=>{const ni={...income};delete ni[who];setIncome(ni);persist(exps,names,budgets,settlements,ni,buffer,sideIncome);setModal(null);}} style={{padding:16,background:"var(--surf2)",border:"none",borderRadius:16,fontSize:15,fontWeight:600,cursor:"pointer",color:"var(--red)"}}>Remove</button>}
                <button onClick={()=>saveIncome(who)} style={{padding:16,background:cv,color:"#fff",border:"none",borderRadius:16,fontSize:16,fontWeight:800,cursor:"pointer"}}>Save income</button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* ── MODAL: Log side hustle income ── */}
      {modal?.type==="sideIncome" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:500,display:"flex",alignItems:"flex-end"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"var(--surf)",width:"100%",maxWidth:430,margin:"0 auto",borderRadius:"24px 24px 0 0",padding:"16px 24px 52px",animation:"slidein .25s ease"}}>
            <div style={{width:36,height:4,background:"var(--border)",borderRadius:2,margin:"0 auto 24px"}}/>
            <div style={{fontSize:20,fontWeight:800,marginBottom:4}}>💪 Side hustle income</div>
            <div style={{fontSize:13,color:"var(--muted)",marginBottom:20,lineHeight:1.5}}>Log a one-off payment — freelance work, selling something, whatever comes in.</div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
              {[["p1",names.p1,"var(--p1)"],["p2",names.p2,"var(--p2)"]].map(([k,label,cv])=>(
                <button key={k} onClick={()=>setDraftSide({...draftSide,by:k})}
                  style={{padding:"14px 10px",background:draftSide.by===k?cv:"var(--surf2)",color:draftSide.by===k?"#fff":"var(--text)",border:"none",borderRadius:14,cursor:"pointer",fontSize:16,fontWeight:700}}>
                  {label}
                </button>
              ))}
            </div>

            <span style={{...S.lbl,marginBottom:8}}>Amount</span>
            <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--surf2)",borderRadius:16,padding:"14px 18px",marginBottom:16,border:"2px solid var(--green)"}}>
              <span style={{fontSize:26,color:"var(--green)",fontWeight:300}}>$</span>
              <input type="text" inputMode="decimal" placeholder="0.00" value={draftSide.amt} onChange={e=>setDraftSide({...draftSide,amt:e.target.value.replace(/[^0-9.]/g,"")})} autoFocus
                style={{fontSize:32,fontWeight:800,border:"none",background:"none",width:"100%",color:"var(--green)",letterSpacing:"-1px"}}/>
            </div>

            <span style={{...S.lbl,marginBottom:8}}>What was it? <span style={S.opt}>(optional)</span></span>
            <input type="text" placeholder="Etsy sale, freelance design, mowing lawns…" value={draftSide.note} onChange={e=>setDraftSide({...draftSide,note:e.target.value})}
              style={{width:"100%",background:"var(--surf2)",border:"none",borderRadius:14,padding:"13px 16px",fontSize:15,marginBottom:20,color:"var(--text)"}}/>

            <button onClick={addSideIncome} style={{width:"100%",background:"var(--green)",color:"#0A1A14",border:"none",borderRadius:18,padding:"18px 0",fontSize:18,fontWeight:800,cursor:"pointer"}}>Log income</button>
          </div>
        </div>
      )}

      {/* ── MODAL: Set unexpected buffer target ── */}
      {modal?.type==="buffer" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:500,display:"flex",alignItems:"flex-end"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"var(--surf)",width:"100%",maxWidth:430,margin:"0 auto",borderRadius:"24px 24px 0 0",padding:"16px 24px 52px",animation:"slidein .25s ease"}}>
            <div style={{width:36,height:4,background:"var(--border)",borderRadius:2,margin:"0 auto 24px"}}/>

            <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--surf2)",borderRadius:16,padding:"14px 18px",marginBottom:18,border:"2px solid var(--border)"}}>
              <span style={{fontSize:26,color:"var(--muted)",fontWeight:300}}>$</span>

            </div>
            <div style={{display:"grid",gridTemplateColumns:buffer?"1fr 1fr":"1fr",gap:10}}>
              {buffer && <button onClick={()=>{setBuffer(null);persist(exps,names,budgets,settlements,income,null,sideIncome);setModal(null);}} style={{padding:16,background:"var(--surf2)",border:"none",borderRadius:16,fontSize:15,fontWeight:600,cursor:"pointer",color:"var(--red)"}}>Remove</button>}

          </div>
        </div>
      )}

      {/* ── MODAL: Settle up ── */}
      {modal?.type==="settle" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:500,display:"flex",alignItems:"flex-end"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"var(--surf)",width:"100%",maxWidth:430,margin:"0 auto",borderRadius:"24px 24px 0 0",padding:"16px 24px 52px",animation:"slidein .25s ease"}}>
            <div style={{width:36,height:4,background:"var(--border)",borderRadius:2,margin:"0 auto 24px"}}/>
            <div style={{fontSize:22,fontWeight:800,marginBottom:6}}>Settle up</div>
            <div style={{fontSize:14,color:"var(--muted)",marginBottom:20,lineHeight:1.5}}>
              Records a payment between you two. Edit the amount for a partial settlement.
            </div>
            {/* Who owes whom */}
            <div style={{background:"var(--surf2)",borderRadius:16,padding:"16px 18px",marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:13,color:"var(--muted)",marginBottom:3}}>{balLabel(totalBal)}</div>
                <div style={{fontSize:11,color:"var(--muted)"}}>before settlement</div>
              </div>
              <div style={{fontSize:26,fontWeight:800,color:"var(--amber)"}}>{nzd(totalBal)}</div>
            </div>
            {/* Amount input */}
            <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--surf2)",borderRadius:16,padding:"14px 18px",marginBottom:22,border:"2px solid var(--green)"}}>
              <span style={{fontSize:26,color:"var(--green)",fontWeight:300}}>$</span>
              <input type="text" inputMode="decimal" value={draftSettle} onChange={e=>setDraftSettle(e.target.value.replace(/[^0-9.]/g,""))} autoFocus
                style={{fontSize:32,fontWeight:800,border:"none",background:"none",width:"100%",color:"var(--green)",letterSpacing:"-1px"}}/>
            </div>
            <button onClick={settleUp} style={{width:"100%",background:"var(--green)",color:"#0A1A14",border:"none",borderRadius:18,padding:"18px 0",fontSize:18,fontWeight:800,cursor:"pointer"}}>Confirm settlement</button>
          </div>
        </div>
      )}

      {/* ══════════════════════════════════════════════════════
          ADD TAB
      ══════════════════════════════════════════════════════ */}
      {tab==="add" && (
        <div key="add" className="tab-anim" style={S.page}>

          {/* Header */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
            <div>
              <div style={S.title}>Add expense</div>
              <div style={{fontSize:14,color:"var(--muted)"}}>{longDate(new Date().toISOString())}</div>
            </div>
            <button onClick={()=>{setDraftNames({p1:names.p1,p2:names.p2});setModal({type:"settings"});}} style={{background:"none",border:"none",cursor:"pointer",padding:"4px 0 4px 12px",color:"var(--muted)"}}>
              <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
                <circle cx={12} cy={12} r={3}/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
            </button>
          </div>

          {/* Balance pill — with Settle up button when there's a balance */}
          <div style={{background:Math.abs(totalBal)<0.01?"#E7F7EF":"#FFF4E0",border:`1.5px solid ${Math.abs(totalBal)<0.01?"#BFE8D3":"#FBDFA8"}`,borderRadius:16,padding:"13px 16px",marginBottom:22,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:13,fontWeight:600,color:Math.abs(totalBal)<0.01?"#2ECFA0":"var(--amber)"}}>
              {Math.abs(totalBal)<0.01?"All square":"Running total"}
              {Math.abs(totalBal)>=0.01&&<div style={{fontSize:12,fontWeight:500,color:"var(--muted)",marginTop:2}}>{balLabel(totalBal)}</div>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div key={totalBal.toFixed(2)} className="amt-anim" style={{fontSize:20,fontWeight:800,color:Math.abs(totalBal)<0.01?"var(--green)":"var(--amber)"}}>{Math.abs(totalBal)<0.01?"✓":nzd(totalBal)}</div>
              {Math.abs(totalBal)>=0.01&&(
                <button onClick={()=>{setDraftSettle(Math.abs(totalBal).toFixed(2));setModal({type:"settle"});}}
                  style={{background:"var(--green)",color:"#0A1A14",border:"none",borderRadius:10,padding:"7px 12px",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
                  Settle ↗
                </button>
              )}
            </div>
          </div>

          {/* Quick add recurring */}
          {recurringItems.length>0 && (
            <div style={{marginBottom:18,position:"relative"}}>
              <button onClick={()=>setShowRecurring(!showRecurring)}
                style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--surf)",border:`2px solid ${showRecurring?"var(--p1)":"var(--border)"}`,borderRadius:16,padding:"13px 16px",cursor:"pointer",transition:"border-color .2s"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <svg width={17} height={17} viewBox="0 0 24 24" fill="none" stroke="var(--p1)" strokeWidth={2.2} strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                  </svg>
                  <span style={{fontSize:15,fontWeight:700,color:"var(--text)"}}>Quick add recurring</span>
                  <span style={{fontSize:11,fontWeight:700,color:"var(--muted)",background:"var(--surf2)",borderRadius:99,padding:"1.5px 8px"}}>{recurringItems.length}</span>
                </div>
                <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"
                  style={{transition:"transform .25s",transform:showRecurring?"rotate(180deg)":"rotate(0deg)",flexShrink:0}}>
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </button>

              {showRecurring && (<>
                <div onClick={()=>setShowRecurring(false)} style={{position:"fixed",inset:0,zIndex:60,background:"transparent"}}/>
                <div style={{position:"absolute",top:"calc(100% + 8px)",left:0,right:0,zIndex:70,background:"var(--surf)",border:"2px solid var(--border)",borderRadius:18,overflow:"hidden",boxShadow:"0 16px 40px rgba(0,0,0,.18)",animation:"dropopen .2s cubic-bezier(.2,.8,.2,1)",maxHeight:280,overflowY:"auto"}}>
                  {recurringItems.map(e=>{
                    const c=catById(e.category||"other");
                    return (
                      <button key={e.id} className="rec-row" onClick={()=>{
                        setBy(e.by); setCat(e.category||"other"); setWhere(e.where);
                        setAmt(String(e.amt)); setFreq(e.frequency); setNote("");
                        setShowRecurring(false);
                        setTimeout(()=>amtRef.current?.focus(),50);
                      }} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"12px 16px",background:"none",border:"none",borderBottom:"1px solid var(--border)",cursor:"pointer",textAlign:"left"}}>
                        <div style={{width:34,height:34,borderRadius:10,background:`${c.color}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{c.emoji}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:14,fontWeight:700,color:"var(--text)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.where}</div>
                          <div style={{fontSize:11,color:"var(--muted)",marginTop:1}}>{e.by==="p1"?names.p1:names.p2} · <span style={{color:c.color,fontWeight:600}}>↻ {e.frequency}</span></div>
                        </div>
                        <div style={{fontSize:15,fontWeight:800,color:"var(--text)",flexShrink:0}}>{nzd(e.amt)}</div>
                      </button>
                    );
                  })}
                </div>
              </>)}
            </div>
          )}

          {/* Who paid */}
          <span style={S.lbl}>Who paid?</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:22}}>
            {[["p1",names.p1,"var(--p1)","#2F6FED"],["p2",names.p2,"var(--p2)","#8A3FEF"]].map(([k,label,cv,hex])=>(
              <button key={k} className="btn-name" onClick={()=>{setBy(k);setTimeout(()=>amtRef.current?.focus(),50);}}
                style={{padding:"22px 16px",background:by===k?cv:"var(--surf)",color:by===k?"#fff":"var(--text)",border:`2.5px solid ${by===k?cv:"var(--border)"}`,borderRadius:20,cursor:"pointer",fontSize:22,fontWeight:800,transition:"all .15s ease",boxShadow:by===k?`0 6px 28px ${hex}50`:"none"}}>
                {label}
              </button>
            ))}
          </div>

          {/* Amount */}
          <span style={S.lbl}>Amount</span>
          <div style={{...S.card,padding:"14px 20px",marginBottom:18,display:"flex",alignItems:"center",gap:6,border:`2px solid ${amt?aC:"var(--border)"}`,transition:"border-color .2s"}}>
            <span style={{fontSize:30,color:amt?aC:"#C6C3B8",fontWeight:300,lineHeight:1,transition:"color .2s"}}>$</span>
            <input ref={amtRef} type="text" inputMode="decimal" placeholder="0.00" value={amt} onChange={e=>setAmt(e.target.value.replace(/[^0-9.]/g,""))}
              style={{fontSize:40,fontWeight:800,border:"none",background:"none",width:"100%",letterSpacing:"-1.5px",color:amt?(by?aC:"var(--text)"):"#C6C3B8",transition:"color .2s"}}/>
          </div>

          {/* Category */}
          <span style={S.lbl}>Category</span>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:18}}>
            {CATS.map(c=>(
              <button key={c.id} className="cat-btn" onClick={()=>setCat(cat===c.id?null:c.id)}
                style={{padding:"10px 6px",background:cat===c.id?`${c.color}22`:"var(--surf)",border:`2px solid ${cat===c.id?c.color:"var(--border)"}`,borderRadius:14,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4,transition:"all .15s"}}>
                <span style={{fontSize:18}}>{c.emoji}</span>
                <span style={{fontSize:11,fontWeight:cat===c.id?700:500,color:cat===c.id?c.color:"var(--muted)"}}>{c.label}</span>
              </button>
            ))}
          </div>

          {/* Where */}
          <span style={S.lbl}>Where? <span style={S.opt}>(optional)</span></span>
          <div style={{position:"relative",marginBottom:14}}>
            <div style={{...S.card,padding:"15px 20px",border:`2px solid ${where?aC:wFocus?"#44445A":"var(--border)"}`,transition:"border-color .2s",borderRadius:filtSuggs.length>0&&wFocus?"20px 20px 0 0":20}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                {suggs.length>0&&<svg width={15} height={15} viewBox="0 0 24 24" fill="none" stroke={where?aC:"var(--muted)"} strokeWidth={2} strokeLinecap="round" style={{flexShrink:0}}><circle cx={12} cy={12} r={9}/><polyline points="12 7 12 12 15 15"/></svg>}
                <input ref={whereRef} type="text" placeholder={suggs.length>0?"Tap for recent places…":"PAK'nSave, power bill…"} value={where}
                  onChange={e=>setWhere(e.target.value)} onFocus={()=>setWFocus(true)} onBlur={()=>setTimeout(()=>setWFocus(false),150)}
                  style={{fontSize:17,fontWeight:500,border:"none",background:"none",width:"100%",color:where?"var(--text)":"#C6C3B8"}}/>
              </div>
            </div>
            {wFocus&&filtSuggs.length>0&&(
              <div style={{position:"absolute",top:"100%",left:0,right:0,background:"var(--surf)",borderRadius:"0 0 20px 20px",border:"2px solid var(--border)",borderTop:"1px solid var(--border)",overflow:"hidden",zIndex:50,boxShadow:"0 12px 32px rgba(0,0,0,.4)"}}>
                {filtSuggs.map(({place,count})=>(
                  <button key={place} className="sugg-row" onMouseDown={e=>e.preventDefault()} onClick={()=>{setWhere(place);setWFocus(false);whereRef.current?.blur();}}
                    style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"12px 16px",background:"none",border:"none",borderBottom:"1px solid var(--border)",cursor:"pointer",textAlign:"left"}}>
                    <div style={{width:30,height:30,borderRadius:9,background:"var(--surf2)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth={2} strokeLinecap="round"><circle cx={12} cy={12} r={9}/><polyline points="12 7 12 12 15 15"/></svg>
                    </div>
                    <span style={{fontSize:15,fontWeight:600,color:"var(--text)",flex:1}}>{place}</span>
                    {count>1&&<span style={{fontSize:12,color:"var(--muted)",background:"var(--surf2)",borderRadius:99,padding:"3px 8px",fontWeight:600}}>×{count}</span>}
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* Note */}
          <span style={S.lbl}>Note <span style={S.opt}>(optional)</span></span>
          <div style={{...S.card,padding:"14px 20px",marginBottom:18,border:`2px solid ${note?aC:"var(--border)"}`,transition:"border-color .2s"}}>
            <input type="text" placeholder="School shoes, Nick's work dinner, Findlay's birthday…" value={note} onChange={e=>setNote(e.target.value)}
              style={{fontSize:15,fontWeight:500,border:"none",background:"none",width:"100%",color:note?"var(--text)":"#C6C3B8"}}/>
          </div>

          {/* Frequency */}
          <span style={S.lbl}>Frequency</span>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:28}}>
            {FREQS.map(f=>(
              <button key={f.id} onClick={()=>setFreq(f.id)}
                style={{padding:"11px 4px",background:freq===f.id?"var(--surf2)":"var(--surf)",border:`2px solid ${freq===f.id?"var(--p1)":"var(--border)"}`,borderRadius:13,cursor:"pointer",fontSize:11.5,fontWeight:freq===f.id?700:500,color:freq===f.id?"var(--p1)":"var(--muted)",transition:"all .15s"}}>
                {f.label}
              </button>
            ))}
          </div>

          {/* Unexpected toggle */}
          <button onClick={()=>setUnexpected(!unexpected)}
            style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:unexpected?"#FFF4E0":"var(--surf)",border:`2px solid ${unexpected?"var(--amber)":"var(--border)"}`,borderRadius:16,padding:"13px 0",cursor:"pointer",marginBottom:18,transition:"all .15s"}}>
            <span style={{fontSize:16}}>⚠️</span>
            <span style={{fontSize:14,fontWeight:700,color:unexpected?"var(--amber)":"var(--muted)"}}>{unexpected?"Marked as unexpected":"Mark as unexpected expense"}</span>
          </button>

          {/* Submit */}
          <button className="add-btn" onClick={addExp}
            style={{width:"100%",background:by?aC:"var(--surf2)",color:by?"#fff":"var(--muted)",border:"none",borderRadius:20,padding:"20px 0",fontSize:18,fontWeight:800,cursor:"pointer",transition:"background .2s,box-shadow .2s",boxShadow:by?`0 8px 32px ${aHex}50`:"none",marginBottom:8}}>
            Add expense
          </button>
        </div>
      )}

      {/* ══════════════════════════════════════════════════════
          WEEK TAB
      ══════════════════════════════════════════════════════ */}
      {tab==="week" && (
        <div key="week" className="tab-anim" style={S.page}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
            <button onClick={()=>setViewWeekOffset(viewWeekOffset-1)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--muted)",fontSize:26,padding:"4px 10px",lineHeight:1}}>‹</button>
            <div style={{...S.title,marginBottom:0,textAlign:"center"}}>{viewWeekOffset===0?"This week":"Week"}</div>
            <button onClick={()=>setViewWeekOffset(viewWeekOffset+1)} disabled={viewWeekOffset>=0} style={{background:"none",border:"none",cursor:"pointer",color:viewWeekOffset>=0?"var(--border)":"var(--muted)",fontSize:26,padding:"4px 10px",lineHeight:1}}>›</button>
          </div>
          <div style={{fontSize:14,color:"var(--muted)",marginBottom:8,textAlign:"center"}}>
            {shortDate(viewW)} — {shortDate(new Date(new Date(viewW).getTime()+6*86400000).toISOString())}
          </div>
          {viewWeekOffset!==0 && <div style={{textAlign:"center",marginBottom:16}}>
            <button onClick={()=>setViewWeekOffset(0)} style={{background:"var(--surf2)",border:"none",borderRadius:99,padding:"6px 14px",fontSize:12,fontWeight:700,color:"var(--p1)",cursor:"pointer"}}>Back to this week</button>
          </div>}
          {viewWeekOffset===0 && <div style={{marginBottom:16}}/>}

          {/* Thursday: last week tally */}
          {viewWeekOffset===0&&isThur&&lastWExps.length>0&&(
            <div style={{background:"#EEF0FF",border:"1.5px solid #C7CCFA",borderRadius:20,padding:"18px 20px",marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:700,color:"#4B4FC4",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>📋 Last week — final tally</div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{fontSize:16,fontWeight:700,color:"#3C40B8"}}>{Math.abs(lastBal)<0.01?"All square ✓":balLabel(lastBal)}</div>
                <div style={{fontSize:26,fontWeight:800,color:"#4B4FC4"}}>{Math.abs(lastBal)<0.01?"✓":nzd(lastBal)}</div>
              </div>
              <div style={{fontSize:13,color:"#6669C9"}}>{lastWExps.length} purchases · {nzd(lastWExps.reduce((a,e)=>a+e.amt,0))} total</div>
            </div>
          )}

          {/* Week summary */}
          <div style={{...S.card,padding:20,marginBottom:14}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
              {[["p1",names.p1,"var(--p1)","#2F6FED"],["p2",names.p2,"var(--p2)","#8A3FEF"]].map(([k,label,cv,hex])=>{
                const paid=viewWExps.filter(e=>e.by===k).reduce((a,e)=>a+e.amt,0);
                return (
                  <div key={k} style={{background:`${hex}14`,borderRadius:14,padding:"14px 16px"}}>
                    <div style={{fontSize:11,fontWeight:700,color:cv,textTransform:"uppercase",letterSpacing:".08em",marginBottom:6}}>{label}</div>
                    <div style={{fontSize:26,fontWeight:800,color:cv}}>{nzd(paid)}</div>
                    <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>paid this week</div>
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:13,color:"var(--muted)",marginBottom:14}}>
              {viewWExps.length} purchase{viewWExps.length!==1?"s":""} · total {nzd(viewWExps.reduce((a,e)=>a+e.amt,0))}
            </div>
            <div style={{borderTop:"1px solid var(--border)",paddingTop:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontSize:14,color:"var(--muted)",fontWeight:600}}>{Math.abs(viewWBal)<0.01?"All square this week":balLabel(viewWBal)}</div>
              <div style={{fontSize:26,fontWeight:800,color:Math.abs(viewWBal)<0.01?"var(--green)":"var(--amber)"}}>{Math.abs(viewWBal)<0.01?"✓":nzd(viewWBal)}</div>
            </div>
          </div>

          {/* Weekly savings snapshot */}
          {(()=>{
            const weekEnd = new Date(new Date(viewW).getTime()+7*86400000-1).toISOString();
            const r1 = incomeAt(income,"p1",weekEnd), r2 = incomeAt(income,"p2",weekEnd);
            const weeklyRegular = (r1?weeklyEquiv(r1.amt,r1.freq):0) + (r2?weeklyEquiv(r2.amt,r2.freq):0);
            const weeklySide    = sideIncome.filter(s=>s.week===viewW).reduce((a,s)=>a+s.amt,0);
            const weeklyIncome  = weeklyRegular + weeklySide;
            if (weeklyIncome===0) return null;
            const weeklySpent  = viewWExps.reduce((a,e)=>a+e.amt,0);
            const weeklyNet    = weeklyIncome - weeklySpent;
            return (
              <div style={{...S.card,padding:"16px 20px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:13,color:"var(--muted)",fontWeight:600}}>Income this week</div>
                  <div style={{fontSize:20,fontWeight:800,color:"var(--text)"}}>{nzd(weeklyIncome)}</div>
                  {weeklySide>0&&<div style={{fontSize:11,color:"var(--green)",marginTop:1,fontWeight:600}}>incl. {nzd(weeklySide)} side hustle</div>}
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:13,color:"var(--muted)",fontWeight:600}}>{weeklyNet>=0?"Left over":"Overspent"}</div>
                  <div style={{fontSize:20,fontWeight:800,color:weeklyNet>=0?"var(--green)":"var(--red)"}}>{nzd(weeklyNet)}</div>
                </div>
              </div>
            );
          })()}

          {/* Category breakdown */}
          {catTotals(viewWExps).length>0&&(<>
            <span style={{...S.lbl,marginTop:8}}>By category</span>
            <div style={{...S.card,padding:"6px 0",marginBottom:14}}>
              {(()=>{const cts=catTotals(viewWExps);const max=cts[0]?.total||1;return cts.map(c=>(
                <div key={c.id} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 16px",borderBottom:"1px solid var(--border)"}}>
                  <span style={{fontSize:18,flexShrink:0}}>{c.emoji}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                      <span style={{fontSize:13,fontWeight:600,color:c.color}}>{c.label}</span>
                      <span style={{fontSize:13,fontWeight:700,color:"var(--text)"}}>{nzd(c.total)}</span>
                    </div>
                    <div style={{background:"var(--border)",borderRadius:99,height:5}}>
                      <div style={{background:c.color,borderRadius:99,height:5,width:`${(c.total/max)*100}%`,opacity:.85}}/>
                    </div>
                  </div>
                </div>
              ))})()}
            </div>
          </>)}

          {/* Settlements this week */}
          {viewWSettl.length>0&&(<>
            <span style={{...S.lbl,marginTop:8}}>Settlements</span>
            <div style={{...S.card,overflow:"hidden",marginBottom:14}}>
              {viewWSettl.map(s=>(
                <div key={s.id} className="row" style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",borderBottom:"1px solid var(--border)"}}>
                  <div style={{width:40,height:40,borderRadius:12,background:"#E7F7EF",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>✓</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:15,fontWeight:600,color:"var(--green)"}}>Settled up</div>

                </div>
              </div>
            );

          {/* Annual total */}
          {(()=>{

            const yrTotal = yrExps.reduce((a,e)=>a+e.amt,0);
            if (yrExps.length===0) return null;
            const monthsElapsed = yr===curMo().slice(0,4) ? (new Date().getMonth()+1) : 12;
            let yrRegularIncome = 0;
            for (let m=1; m<=monthsElapsed; m++) {
              const moStr = `${yr}-${String(m).padStart(2,"0")}-32`;
              const r1 = incomeAt(income,"p1",moStr), r2 = incomeAt(income,"p2",moStr);
              yrRegularIncome += (r1?monthlyEquiv(r1.amt,r1.freq):0) + (r2?monthlyEquiv(r2.amt,r2.freq):0);
            }

            const yrIncome = yrRegularIncome + yrSideIncome;

                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:14,fontWeight:600,color:"var(--text)"}}>{c.label}</span>

                      </div>
                      <span style={{fontSize:14,fontWeight:700,color:budget>0?barColor(p):"var(--text)"}}>

            <span style={S.lbl}>Monthly recurring</span>

              {recurringItems.map(e=>{

        {[

            <svg key="a" width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"><circle cx={12} cy={12} r={9}/><line x1={12} y1={8} x2={12} y2={16}/><line x1={8} y1={12} x2={16} y2={12}/></svg>],
          ["week",   "Week",
            <svg key="w" width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"><rect x={3} y={4} width={18} height={18} rx={2}/><line x1={16} y1={2} x2={16} y2={6}/><line x1={8} y1={2} x2={8} y2={6}/><line x1={3} y1={10} x2={21} y2={10}/></svg>],
          ["budget", "Budget",
            <svg key="b" width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"><line x1={18} y1={20} x2={18} y2={10}/><line x1={12} y1={20} x2={12} y2={4}/><line x1={6} y1={20} x2={6} y2={14}/></svg>],
        ].map(([t,label,icon])=>(
          <button key={t} className="tab-btn" onClick={()=>setTab(t)}
            style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"10px 0",background:"none",border:"none",cursor:"pointer",color:tab===t?"var(--p1)":"var(--muted)",fontSize:11,fontWeight:tab===t?700:400}}>
            {icon}{label}
          </button>
        ))}
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
