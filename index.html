<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <title>Expenses</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body { background: #F4F3EF; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    input, button { outline: none; -webkit-appearance: none; font-family: inherit; }
    :root {
      --p1: #1D4ED8;
      --p2: #7C3AED;
      --bg: #F4F3EF;
      --card: #FFFFFF;
      --text: #1C1C1E;
      --muted: #8E8E93;
      --border: #E5E3DF;
      --green: #15803D;
      --amber: #B45309;
      --red: #991B1B;
    }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeup  { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slidein { from { transform:translateY(100%); } to { transform:translateY(0); } }
    @keyframes bar     { 0%,100%{opacity:.6} 50%{opacity:1} }
    .row:last-child      { border-bottom: none !important; }
    .sugg-row:last-child { border-bottom: none !important; }
    .sugg-row:active { background: var(--bg) !important; }
    .btn-name:active { transform: scale(.97); }
    .add-btn:active  { transform: scale(.98); }
    .tab-btn:active  { opacity: .7; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Firebase (compat SDK — no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
// ================================================================
//  STEP 1 — Paste your Firebase config here.
//  Get it from: Firebase Console → Project Settings → Your Apps → </> 
// ================================================================
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDSnrvUcXuOvF3f4uR4RLNt_ZunntQaFBA",
  authDomain:        "nick-puai-expenses.firebaseapp.com",
  databaseURL:       "https://nick-puai-expenses-default-rtdb.firebaseio.com",
  projectId:         "nick-puai-expenses",
  storageBucket:     "nick-puai-expenses.firebasestorage.app",
  messagingSenderId: "610510764626",
  appId:             "1:610510764626:web:0b15a873a383667be33d8b"
};
// ================================================================

// ================================================================
//  STEP 2 — Set your names (optional — can also change in the app).
// ================================================================
const DEFAULT_NAMES = { p1: "Nick", p2: "Puai" };
// ================================================================

const IS_CONFIGURED = !Object.values(FIREBASE_CONFIG).some(v => String(v).startsWith("YOUR_"));

let db = null;
if (IS_CONFIGURED) {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
}

// ── Helpers ────────────────────────────────────────────────────
const weekOf = (d = new Date()) => {
  const dt = new Date(d);
  dt.setHours(0, 0, 0, 0);
  dt.setDate(dt.getDate() - ((dt.getDay() - 4 + 7) % 7)); // Thursday start
  return dt.toISOString();
};
const nzd = n =>
  new Intl.NumberFormat("en-NZ", { style: "currency", currency: "NZD" }).format(Math.abs(n));
const shortDate = iso =>
  new Date(iso).toLocaleDateString("en-NZ", { weekday: "short", month: "short", day: "numeric" });
const longDate = iso =>
  new Date(iso).toLocaleDateString("en-NZ", { weekday: "long", day: "numeric", month: "long" });
const getBal = exps =>
  exps.reduce((a, e) => a + (e.by === "p1" ? e.amt / 2 : -e.amt / 2), 0);

// ── React ──────────────────────────────────────────────────────
const { useState, useEffect, useCallback, useRef, useMemo } = React;
const h = React.createElement;

// ── Setup screen (shown when Firebase isn't configured) ────────
function SetupScreen() {
  return h("div", { style: { padding: "40px 24px", maxWidth: 430, margin: "0 auto" } },
    h("div", { style: { fontSize: 40, marginBottom: 16 } }, "⚙️"),
    h("div", { style: { fontSize: 24, fontWeight: 800, marginBottom: 10, color: "var(--text)" } }, "Setup required"),
    h("div", { style: { fontSize: 15, color: "var(--muted)", lineHeight: 1.6, marginBottom: 28 } },
      "Open ", h("code", { style: c.code }, "index.html"),
      " and follow the steps in ", h("code", { style: c.code }, "README.md"), " to connect Firebase."
    ),
    ...[
      ["1", "Create a free Firebase project at firebase.google.com"],
      ["2", "Enable Realtime Database → start in test mode"],
      ["3", "Go to Project Settings → Your apps → copy the config"],
      ["4", "Paste the config into index.html (clearly marked at the top)"],
      ["5", "Push to GitHub, enable Pages, and you're live!"],
    ].map(([n, txt]) =>
      h("div", { key: n, style: { display: "flex", gap: 14, marginBottom: 16, alignItems: "flex-start" } },
        h("div", { style: { width: 28, height: 28, borderRadius: 14, background: "var(--p1)", color: "#fff", fontSize: 13, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } }, n),
        h("div", { style: { fontSize: 14, color: "var(--text)", lineHeight: 1.6, paddingTop: 5 } }, txt)
      )
    )
  );
}

// ── Shared style constants ─────────────────────────────────────
const c = {
  card:  { background: "var(--card)", borderRadius: 20, border: "1.5px solid var(--border)" },
  label: { fontSize: 11, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 10, display: "block" },
  code:  { background: "#E8E6E0", borderRadius: 4, padding: "1px 6px", fontSize: 13 },
};

// ── Main App ───────────────────────────────────────────────────
function App() {
  const [tab,        setTab]        = useState("add");
  const [exps,       setExps]       = useState([]);
  const [names,      setNames]      = useState(DEFAULT_NAMES);
  const [loading,    setLoading]    = useState(true);
  const [syncing,    setSyncing]    = useState(false);
  const [offline,    setOffline]    = useState(false);
  const [by,         setBy]         = useState(null);
  const [amt,        setAmt]        = useState("");
  const [where,      setWhere]      = useState("");
  const [whereFocus, setWhereFocus] = useState(false);
  const [toast,      setToast]      = useState(null);
  const [sheet,      setSheet]      = useState(false);
  const [draftName,  setDraftName]  = useState("");
  const [deleteId,   setDeleteId]   = useState(null);
  const amtRef   = useRef(null);
  const whereRef = useRef(null);

  // Real-time Firebase listener
  useEffect(() => {
    if (!db) return;
    const ref = db.ref("/tracker");
    ref.on("value", snapshot => {
      const data = snapshot.val() || {};
      // Sort newest-first on load
      const loaded = (data.expenses || []).sort((a, b) => b.ts.localeCompare(a.ts));
      setExps(loaded);
      if (data.names) setNames(data.names);
      setLoading(false);
      setSyncing(false);
      setOffline(false);
    }, () => {
      setLoading(false);
      setOffline(true);
    });
    return () => ref.off();
  }, []);

  const persist = useCallback(async (newExps, newNames) => {
    if (!db) return;
    setSyncing(true);
    try {
      await db.ref("/tracker").set({ expenses: newExps, names: newNames });
    } catch {
      showToast("Couldn't save — check your connection", true);
      setSyncing(false);
    }
  }, []);

  const showToast = (msg, err = false) => {
    setToast({ msg, err });
    setTimeout(() => setToast(null), 2400);
  };

  // Autocomplete: places sorted by frequency
  const suggestions = useMemo(() => {
    const freq = {};
    exps.forEach(e => {
      if (e.where && e.where !== "Unspecified")
        freq[e.where] = (freq[e.where] || 0) + 1;
    });
    return Object.entries(freq)
      .sort((a, b) => b[1] - a[1])
      .map(([place, count]) => ({ place, count }));
  }, [exps]);

  const filteredSuggs = useMemo(() => {
    if (!whereFocus) return [];
    if (!where.trim()) return suggestions.slice(0, 6);
    const q = where.toLowerCase();
    return suggestions
      .filter(s => s.place.toLowerCase().includes(q) && s.place.toLowerCase() !== q)
      .slice(0, 6);
  }, [where, whereFocus, suggestions]);

  // Derived data
  const thisW     = weekOf();
  const lastW     = weekOf(new Date(Date.now() - 7 * 86400000));
  const isThur    = new Date().getDay() === 4;
  const thisWExps = exps.filter(e => e.week === thisW);
  const lastWExps = exps.filter(e => e.week === lastW);
  const totalBal  = getBal(exps);
  const weekBal   = getBal(thisWExps);
  const lastBal   = getBal(lastWExps);
  const aC        = by === "p1" ? "var(--p1)" : by === "p2" ? "var(--p2)" : "var(--text)";
  const aHex      = by === "p1" ? "#1D4ED8"   : by === "p2" ? "#7C3AED"   : "#1C1C1E";

  const balLabel = b => {
    if (Math.abs(b) < 0.01) return "All square ✓";
    const debtor  = b > 0 ? names.p2 : names.p1;
    const creditor = b > 0 ? names.p1 : names.p2;
    return `${debtor} owes ${creditor}`;
  };

  // Actions
  async function addExp() {
    if (!by) return showToast("Tap who paid first", true);
    const v = parseFloat(amt);
    if (!v || v <= 0) return showToast("Enter a valid amount", true);
    const exp = {
      id:    String(Date.now()),
      ts:    new Date().toISOString(),
      amt:   v,
      where: where.trim() || "Unspecified",
      by,
      week:  thisW,
    };
    const ne = [exp, ...exps];
    setAmt(""); setWhere(""); setWhereFocus(false);
    showToast(`${nzd(v)} added ✓`);
    await persist(ne, names);
  }

  async function delExp(id) {
    const ne = exps.filter(e => e.id !== id);
    setDeleteId(null);
    await persist(ne, names);
  }

  async function saveName() {
    const nn = { ...names, p2: draftName.trim() || names.p2 };
    setSheet(false);
    showToast("Name saved ✓");
    await persist(exps, nn);
  }

  const selectSugg = place => {
    setWhere(place);
    setWhereFocus(false);
    whereRef.current?.blur();
  };

  // ── Loading ────────────────────────────────────────────────
  if (loading) return h("div", { style: { display: "flex", justifyContent: "center", alignItems: "center", height: "100vh", background: "var(--bg)" } },
    h("div", { style: { width: 28, height: 28, borderRadius: 14, border: "3px solid var(--border)", borderTopColor: "var(--p1)", animation: "spin .7s linear infinite" } })
  );

  // ── Render ─────────────────────────────────────────────────
  return h("div", { style: { background: "var(--bg)", minHeight: "100vh", maxWidth: 430, margin: "0 auto", paddingBottom: 90 } },

    // Sync bar
    syncing && h("div", { style: { position: "fixed", top: 0, left: 0, right: 0, height: 3, background: "var(--p1)", zIndex: 9999, animation: "bar 1.2s ease infinite" } }),

    // Offline banner
    offline && h("div", { style: { background: "#FEF3C7", borderBottom: "1px solid #FDE68A", padding: "10px 20px", fontSize: 13, fontWeight: 600, color: "#92400E", textAlign: "center" } },
      "⚠️ No connection — changes may not save"
    ),

    // Toast
    toast && h("div", { style: { position: "fixed", top: 20, left: "50%", transform: "translateX(-50%)", background: toast.err ? "var(--red)" : "#111827", color: "#fff", borderRadius: 99, padding: "11px 22px", fontSize: 14, fontWeight: 600, zIndex: 9999, animation: "fadeup .2s ease", whiteSpace: "nowrap", boxShadow: "0 8px 30px rgba(0,0,0,.25)", pointerEvents: "none" } }, toast.msg),

    // Delete confirm sheet
    deleteId && h("div", { onClick: () => setDeleteId(null), style: { position: "fixed", inset: 0, background: "rgba(0,0,0,.45)", zIndex: 500, display: "flex", alignItems: "flex-end" } },
      h("div", { onClick: e => e.stopPropagation(), style: { background: "var(--card)", width: "100%", maxWidth: 430, margin: "0 auto", borderRadius: "24px 24px 0 0", padding: "20px 24px 48px", animation: "slidein .25s ease" } },
        h("div", { style: { width: 36, height: 4, background: "var(--border)", borderRadius: 2, margin: "0 auto 20px" } }),
        h("div", { style: { fontSize: 18, fontWeight: 700, marginBottom: 6 } }, "Delete this entry?"),
        h("div", { style: { fontSize: 14, color: "var(--muted)", marginBottom: 24 } }, "This can't be undone."),
        h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 } },
          h("button", { onClick: () => setDeleteId(null), style: { padding: 16, background: "var(--bg)", border: "none", borderRadius: 16, fontSize: 16, fontWeight: 600, cursor: "pointer" } }, "Cancel"),
          h("button", { onClick: () => delExp(deleteId), style: { padding: 16, background: "var(--red)", color: "#fff", border: "none", borderRadius: 16, fontSize: 16, fontWeight: 600, cursor: "pointer" } }, "Delete")
        )
      )
    ),

    // Settings sheet
    sheet && h("div", { onClick: () => setSheet(false), style: { position: "fixed", inset: 0, background: "rgba(0,0,0,.5)", zIndex: 500, display: "flex", alignItems: "flex-end" } },
      h("div", { onClick: e => e.stopPropagation(), style: { background: "var(--card)", width: "100%", maxWidth: 430, margin: "0 auto", borderRadius: "24px 24px 0 0", padding: "16px 24px 52px", animation: "slidein .25s ease" } },
        h("div", { style: { width: 36, height: 4, background: "var(--border)", borderRadius: 2, margin: "0 auto 28px" } }),
        h("div", { style: { fontSize: 22, fontWeight: 800, marginBottom: 8 } }, "Partner's name"),
        h("div", { style: { fontSize: 15, color: "var(--muted)", marginBottom: 24, lineHeight: 1.5 } }, "Change the name shown on buttons and summaries."),
        h("input", { value: draftName, onChange: e => setDraftName(e.target.value), placeholder: names.p2, autoFocus: true, style: { width: "100%", border: "2px solid var(--border)", borderRadius: 16, padding: "16px 18px", fontSize: 18, marginBottom: 18, color: "var(--text)", background: "var(--bg)" } }),
        h("button", { onClick: saveName, style: { width: "100%", background: "var(--p2)", color: "#fff", border: "none", borderRadius: 18, padding: "18px 0", fontSize: 18, fontWeight: 800, cursor: "pointer" } }, "Save name")
      )
    ),

    // ═══════════════════════════════════════════
    //  ADD TAB
    // ═══════════════════════════════════════════
    tab === "add" && h("div", { style: { padding: "28px 20px 0" } },

      // Header
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 22 } },
        h("div", null,
          h("div", { style: { fontSize: 27, fontWeight: 800, letterSpacing: "-0.7px", color: "var(--text)" } }, "Add expense"),
          h("div", { style: { fontSize: 14, color: "var(--muted)", marginTop: 3 } }, longDate(new Date().toISOString()))
        ),
        h("button", { onClick: () => { setDraftName(names.p2); setSheet(true); }, style: { background: "none", border: "none", cursor: "pointer", padding: "4px 0 4px 12px", color: "var(--muted)" } },
          h("svg", { width: 22, height: 22, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
            h("circle", { cx: 12, cy: 12, r: 3 }),
            h("path", { d: "M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" })
          )
        )
      ),

      // Balance pill
      h("div", { style: { background: Math.abs(totalBal) < 0.01 ? "#F0FDF4" : "#FFFBEB", border: `1.5px solid ${Math.abs(totalBal) < 0.01 ? "#BBF7D0" : "#FDE68A"}`, borderRadius: 16, padding: "14px 18px", marginBottom: 26, display: "flex", justifyContent: "space-between", alignItems: "center" } },
        h("div", { style: { fontSize: 13, fontWeight: 600, color: Math.abs(totalBal) < 0.01 ? "#166534" : "#78350F" } },
          Math.abs(totalBal) < 0.01 ? "Running total" : balLabel(totalBal)
        ),
        h("div", { style: { fontSize: 20, fontWeight: 800, color: Math.abs(totalBal) < 0.01 ? "var(--green)" : "var(--amber)" } },
          Math.abs(totalBal) < 0.01 ? "✓ All square" : nzd(totalBal)
        )
      ),

      // Who paid
      h("span", { style: c.label }, "Who paid?"),
      h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 22 } },
        [["p1", names.p1, "var(--p1)", "#1D4ED8"], ["p2", names.p2, "var(--p2)", "#7C3AED"]].map(([k, label, cv, hex]) =>
          h("button", { key: k, className: "btn-name",
            onClick: () => { setBy(k); setTimeout(() => amtRef.current?.focus(), 50); },
            style: { padding: "22px 16px", background: by === k ? cv : "var(--card)", color: by === k ? "#fff" : "var(--text)", border: `2.5px solid ${by === k ? cv : "var(--border)"}`, borderRadius: 20, cursor: "pointer", fontSize: 22, fontWeight: 800, transition: "all .15s ease", boxShadow: by === k ? `0 6px 24px ${hex}45` : "none" }
          }, label)
        )
      ),

      // Amount
      h("span", { style: c.label }, "Amount"),
      h("div", { style: { ...c.card, padding: "14px 20px", marginBottom: 14, display: "flex", alignItems: "center", gap: 6, border: `2px solid ${amt ? aC : "var(--border)"}`, transition: "border-color .2s" } },
        h("span", { style: { fontSize: 30, color: amt ? aC : "#D1D1D6", fontWeight: 300, lineHeight: 1, transition: "color .2s" } }, "$"),
        h("input", {
          ref: amtRef, type: "text", inputMode: "decimal", placeholder: "0.00", value: amt,
          onChange: e => setAmt(e.target.value.replace(/[^0-9.]/g, "")),
          style: { fontSize: 40, fontWeight: 800, border: "none", background: "none", width: "100%", letterSpacing: "-1.5px", color: amt ? (by ? aC : "var(--text)") : "#D1D1D6", transition: "color .2s" }
        })
      ),

      // Where (with autocomplete)
      h("span", { style: c.label }, "Where? ", h("span", { style: { textTransform: "none", letterSpacing: 0, fontWeight: 400, fontSize: 11 } }, "(optional)")),
      h("div", { style: { position: "relative", marginBottom: 26 } },
        h("div", { style: { ...c.card, padding: "16px 20px", border: `2px solid ${where ? aC : whereFocus ? "#A0A0A8" : "var(--border)"}`, transition: "border-color .2s", borderRadius: whereFocus && filteredSuggs.length > 0 ? "20px 20px 0 0" : 20 } },
          h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
            suggestions.length > 0 && h("svg", { width: 16, height: 16, viewBox: "0 0 24 24", fill: "none", stroke: where ? aC : "var(--muted)", strokeWidth: 2, strokeLinecap: "round", flexShrink: 0 },
              h("circle", { cx: 12, cy: 12, r: 9 }), h("polyline", { points: "12 7 12 12 15 15" })
            ),
            h("input", {
              ref: whereRef, type: "text", value: where,
              placeholder: suggestions.length > 0 ? "Tap to see recent places…" : "PAK'nSave, electricity…",
              onChange: e => setWhere(e.target.value),
              onFocus:  () => setWhereFocus(true),
              onBlur:   () => setTimeout(() => setWhereFocus(false), 150),
              style: { fontSize: 17, fontWeight: 500, border: "none", background: "none", width: "100%", color: where ? "var(--text)" : "#D1D1D6" }
            })
          )
        ),
        whereFocus && filteredSuggs.length > 0 && h("div", { style: { position: "absolute", top: "100%", left: 0, right: 0, background: "var(--card)", borderRadius: "0 0 20px 20px", border: "2px solid var(--border)", borderTop: "1px solid var(--border)", overflow: "hidden", zIndex: 50, boxShadow: "0 8px 24px rgba(0,0,0,.08)" } },
          filteredSuggs.map(({ place, count }) =>
            h("button", { key: place, className: "sugg-row",
              onMouseDown: e => e.preventDefault(),
              onClick: () => selectSugg(place),
              style: { display: "flex", alignItems: "center", gap: 12, width: "100%", padding: "13px 16px", background: "none", border: "none", borderBottom: "1px solid var(--border)", cursor: "pointer", textAlign: "left" }
            },
              h("div", { style: { width: 32, height: 32, borderRadius: 9, background: "#F4F3EF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } },
                h("svg", { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "var(--muted)", strokeWidth: 2, strokeLinecap: "round" },
                  h("circle", { cx: 12, cy: 12, r: 9 }), h("polyline", { points: "12 7 12 12 15 15" })
                )
              ),
              h("span", { style: { fontSize: 15, fontWeight: 600, color: "var(--text)", flex: 1 } }, place),
              count > 1 && h("span", { style: { fontSize: 12, color: "var(--muted)", background: "#F4F3EF", borderRadius: 99, padding: "3px 8px", fontWeight: 600 } }, `×${count}`)
            )
          )
        )
      ),

      // Submit
      h("button", { className: "add-btn", onClick: addExp,
        style: { width: "100%", background: by ? aC : "#1C1C1E", color: "#fff", border: "none", borderRadius: 20, padding: "20px 0", fontSize: 18, fontWeight: 800, cursor: "pointer", transition: "background .2s, box-shadow .2s", boxShadow: by ? `0 8px 32px ${aHex}50` : "none" }
      }, "Add expense")
    ),

    // ═══════════════════════════════════════════
    //  WEEK TAB
    // ═══════════════════════════════════════════
    tab === "week" && h("div", { style: { padding: "28px 20px 0" } },

      h("div", { style: { fontSize: 27, fontWeight: 800, letterSpacing: "-0.7px", marginBottom: 4 } }, "This week"),
      h("div", { style: { fontSize: 14, color: "var(--muted)", marginBottom: 24 } },
        shortDate(thisW), " — ", shortDate(new Date(new Date(thisW).getTime() + 6 * 86400000).toISOString())
      ),

      // Thursday: last week tally
      isThur && lastWExps.length > 0 && h("div", { style: { background: "#EEF2FF", border: "1.5px solid #C7D2FE", borderRadius: 20, padding: "18px 20px", marginBottom: 14 } },
        h("div", { style: { fontSize: 11, fontWeight: 700, color: "#4338CA", textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 10 } }, "📋 Last week — final tally"),
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 } },
          h("div", { style: { fontSize: 16, fontWeight: 700, color: "#3730A3" } }, Math.abs(lastBal) < 0.01 ? "All square — nothing owed ✓" : balLabel(lastBal)),
          h("div", { style: { fontSize: 26, fontWeight: 800, color: "#4338CA" } }, Math.abs(lastBal) < 0.01 ? "✓" : nzd(lastBal))
        ),
        h("div", { style: { fontSize: 13, color: "#6366F1" } },
          lastWExps.length, " purchases · Total spent ", nzd(lastWExps.reduce((a, e) => a + e.amt, 0))
        )
      ),

      // This week summary card
      h("div", { style: { ...c.card, padding: 20, marginBottom: 14 } },
        h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 18 } },
          [["p1", names.p1, "var(--p1)", "#1D4ED8"], ["p2", names.p2, "var(--p2)", "#7C3AED"]].map(([k, label, cv, hex]) => {
            const paid = thisWExps.filter(e => e.by === k).reduce((a, e) => a + e.amt, 0);
            return h("div", { key: k, style: { background: `${hex}12`, borderRadius: 14, padding: "14px 16px" } },
              h("div", { style: { fontSize: 11, fontWeight: 700, color: cv, textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 6 } }, label),
              h("div", { style: { fontSize: 26, fontWeight: 800, color: cv } }, nzd(paid)),
              h("div", { style: { fontSize: 12, color: "var(--muted)", marginTop: 2 } }, "paid this week")
            );
          })
        ),
        h("div", { style: { fontSize: 13, color: "var(--muted)", marginBottom: 14 } },
          thisWExps.length, " purchase", thisWExps.length !== 1 ? "s" : "", " · Total spent ",
          h("b", { style: { color: "var(--text)" } }, nzd(thisWExps.reduce((a, e) => a + e.amt, 0)))
        ),
        h("div", { style: { borderTop: "1px solid var(--border)", paddingTop: 16, display: "flex", justifyContent: "space-between", alignItems: "center" } },
          h("div", { style: { fontSize: 14, color: "var(--muted)", fontWeight: 600 } },
            Math.abs(weekBal) < 0.01 ? "All square this week" : balLabel(weekBal)
          ),
          h("div", { style: { fontSize: 26, fontWeight: 800, color: Math.abs(weekBal) < 0.01 ? "var(--green)" : "var(--amber)" } },
            Math.abs(weekBal) < 0.01 ? "✓" : nzd(weekBal)
          )
        )
      ),

      // Purchase list
      h("div", { style: { fontSize: 11, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".1em", marginBottom: 10, marginTop: 8 } }, "Purchases this week"),

      thisWExps.length === 0
        ? h("div", { style: { textAlign: "center", padding: "60px 20px", color: "var(--muted)" } },
            h("div", { style: { fontSize: 48, marginBottom: 14 } }, "🧾"),
            h("div", { style: { fontSize: 17, fontWeight: 700, marginBottom: 6 } }, "Nothing yet"),
            h("div", { style: { fontSize: 14 } }, "Add your first expense from the Add tab")
          )
        : h("div", { style: { ...c.card, overflow: "hidden" } },
            thisWExps.map(exp =>
              h("div", { key: exp.id, className: "row", style: { display: "flex", alignItems: "center", padding: "14px 16px", borderBottom: "1px solid var(--border)", gap: 12 } },
                h("div", { style: { width: 40, height: 40, borderRadius: 12, flexShrink: 0, background: exp.by === "p1" ? "#1D4ED815" : "#7C3AED15", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, fontWeight: 800, color: exp.by === "p1" ? "var(--p1)" : "var(--p2)" } },
                  (exp.by === "p1" ? names.p1 : names.p2)[0]
                ),
                h("div", { style: { flex: 1, minWidth: 0 } },
                  h("div", { style: { fontSize: 15, fontWeight: 600, color: "var(--text)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, exp.where),
                  h("div", { style: { fontSize: 12, color: "var(--muted)", marginTop: 2 } }, (exp.by === "p1" ? names.p1 : names.p2), " · ", shortDate(exp.ts))
                ),
                h("div", { style: { fontSize: 17, fontWeight: 800, color: "var(--text)", flexShrink: 0 } }, nzd(exp.amt)),
                h("button", { onClick: () => setDeleteId(exp.id), style: { background: "none", border: "none", cursor: "pointer", color: "#C7C7CC", fontSize: 22, padding: "0 0 0 8px", flexShrink: 0, lineHeight: 1 } }, "×")
              )
            )
          )
    ),

    // ═══════════════════════════════════════════
    //  TAB BAR
    // ═══════════════════════════════════════════
    h("div", { style: { position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 430, background: "var(--card)", borderTop: "1px solid var(--border)", display: "flex", zIndex: 100, paddingBottom: "env(safe-area-inset-bottom,0px)" } },
      [
        ["add",  "Add",
          h("svg", { key: "i1", width: 22, height: 22, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2.5, strokeLinecap: "round", strokeLinejoin: "round" },
            h("circle", { cx: 12, cy: 12, r: 9 }), h("line", { x1: 12, y1: 8, x2: 12, y2: 16 }), h("line", { x1: 8, y1: 12, x2: 16, y2: 12 })
          )
        ],
        ["week", "Week",
          h("svg", { key: "i2", width: 22, height: 22, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2.5, strokeLinecap: "round", strokeLinejoin: "round" },
            h("rect", { x: 3, y: 4, width: 18, height: 18, rx: 2 }), h("line", { x1: 16, y1: 2, x2: 16, y2: 6 }), h("line", { x1: 8, y1: 2, x2: 8, y2: 6 }), h("line", { x1: 3, y1: 10, x2: 21, y2: 10 })
          )
        ],
      ].map(([t, label, icon]) =>
        h("button", { key: t, className: "tab-btn", onClick: () => setTab(t),
          style: { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "10px 0", background: "none", border: "none", cursor: "pointer", color: tab === t ? "var(--p1)" : "var(--muted)", fontSize: 11, fontWeight: tab === t ? 700 : 400 }
        }, icon, label)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  IS_CONFIGURED ? h(App) : h(SetupScreen)
);
</script>
</body>
</html>
