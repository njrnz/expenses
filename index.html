<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Household · Expenses & Plan</title>
    <style>
      :root {
        --bg: #f5f5f8;
        --paper: #fff;
        --ink: #202433;
        --muted: #656b7b;
        --line: #e4e6ee;
        --blue: #4358db;
        --purple: #7854df;
        --green: #147c5d;
        --red: #b82f43;
        --amber: #956017;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      button,
      input,
      select,
      textarea {
        border-radius: 12px;
      }
      button {
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        padding: 10px 15px;
        font-weight: 650;
      }
      button:hover {
        border-color: #b6bdd5;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #95a3ff;
        outline-offset: 3px;
      }
      input,
      select,
      textarea {
        border: 1px solid var(--line);
        padding: 11px 13px;
        background: #fff;
        color: var(--ink);
        width: 100%;
        min-width: 0;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 6px;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 16px;
        min-width: 0;
      }
      legend {
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 7px;
      }
      .wrap {
        max-width: 1100px;
        margin: auto;
        padding: 26px 30px 100px;
      }
      .brand {
        font-size: 25px;
        font-weight: 850;
        letter-spacing: -1px;
      }
      .brand span {
        color: var(--blue);
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
      }
      .top-right {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
      }
      .shell {
        display: grid;
        grid-template-columns: 160px minmax(0, 1fr);
        gap: 32px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .nav button {
        border: 0;
        background: transparent;
        text-align: left;
        color: var(--muted);
        padding: 12px 16px;
      }
      .nav button.active {
        background: #e9ecff;
        color: var(--blue);
      }
      .nav small {
        display: block;
        margin: 18px 15px;
        color: var(--muted);
        font-size: 11px;
      }
      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1px;
        line-height: 1.15;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 19px;
        letter-spacing: -0.4px;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 12px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 7px;
      }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        margin-bottom: 16px;
        box-shadow: 0 7px 25px #20243304;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(230px, 1fr);
        gap: 18px;
        align-items: start;
      }
      .split {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .metrics.three {
        grid-template-columns: repeat(3, 1fr);
      }
      .metric b {
        display: block;
        font-size: 24px;
        letter-spacing: -0.7px;
      }
      .metric small {
        color: var(--muted);
      }
      .primary {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .accent {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .danger {
        color: var(--red);
      }
      .good {
        color: var(--green);
      }
      .warning {
        color: var(--amber);
      }
      .wide {
        width: 100%;
      }
      .people {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .people input {
        position: absolute;
        opacity: 0;
        width: 1px;
      }
      .people label {
        margin: 0;
        padding: 13px;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
      }
      .people input:checked + label {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }
      .people input[value="p2"]:checked + label {
        background: var(--purple);
        border-color: var(--purple);
      }
      .people input:focus-visible + label {
        outline: 3px solid #95a3ff;
        outline-offset: 3px;
      }
      .amount-field {
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 2px solid var(--line);
        margin-bottom: 17px;
      }
      .amount-field span {
        font-size: 27px;
        color: var(--muted);
      }
      .amount-field input {
        border: 0;
        font-size: 39px;
        font-weight: 800;
        letter-spacing: -1px;
        padding: 4px 0;
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 13px;
        margin-bottom: 16px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
      }
      .chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .chips button {
        font-size: 12px;
        padding: 8px 10px;
      }
      .category-pills {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }
      .category-pills label {
        font-size: 12px;
        padding: 9px 4px;
      }
      .category-pills input:checked + label {
        background: #eef0ff;
        color: var(--blue);
      }
      details {
        margin: 12px 0;
      }
      summary {
        cursor: pointer;
        font-weight: 650;
        font-size: 13px;
        padding: 8px 0;
      }
      .error {
        background: #fff0f2;
        color: var(--red);
        padding: 11px 14px;
        border-radius: 12px;
        margin-bottom: 12px;
      }
      .error:empty {
        display: none;
      }
      .notice {
        background: #f0f2ff;
        padding: 12px 14px;
        border-radius: 12px;
        color: #3d4690;
        font-size: 13px;
      }
      .hero {
        background: linear-gradient(120deg, #303da3, #6c48d7);
        color: #fff;
        border: 0;
      }
      .hero .eyebrow,
      .hero .muted {
        color: #e0e2ff;
      }
      .hero .large {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -1.3px;
      }
      .hero .metrics {
        border-top: 1px solid #ffffff35;
        margin-top: 16px;
        padding-top: 15px;
      }
      .list-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 0;
        border-top: 1px solid var(--line);
      }
      button.list-row {
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-top: 1px solid var(--line);
        border-radius: 0;
        font-weight: 400;
      }
      button.list-row:hover {
        background: #f8f8fc;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .grow b {
        display: block;
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .icon {
        width: 35px;
        height: 35px;
        background: #f1f2fa;
        border-radius: 11px;
        display: grid;
        place-items: center;
        color: var(--blue);
        font-size: 19px;
        flex-shrink: 0;
      }
      .money {
        font-weight: 750;
        white-space: nowrap;
      }
      .bar {
        height: 7px;
        background: #eceef5;
        border-radius: 99px;
        overflow: hidden;
        margin-top: 8px;
      }
      .bar span {
        display: block;
        height: 100%;
        background: var(--blue);
        border-radius: 99px;
      }
      .day-title {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
        margin: 20px 0 5px;
      }
      .empty {
        text-align: center;
        padding: 28px 10px;
        color: var(--muted);
      }
      .row-actions {
        display: flex;
        gap: 6px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }
      .toolbar input {
        flex: 1;
      }
      .toolbar select {
        width: 160px;
      }
      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 17px;
      }
      .form-actions button {
        flex: 1;
      }
      .entry-submit {
        padding: 14px;
        font-size: 16px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .check input {
        width: auto;
      }
      .check label {
        margin: 0;
      }
      .pill {
        font-size: 11px;
        color: var(--blue);
        background: #eef0ff;
        border-radius: 99px;
        padding: 3px 8px;
      }
      dialog {
        border: 0;
        border-radius: 23px;
        background: #fff;
        color: var(--ink);
        padding: 0;
        width: min(540px, calc(100% - 28px));
        max-height: 90dvh;
        box-shadow: 0 30px 80px #11152840;
      }
      dialog::backdrop {
        background: #171a2a75;
      }
      .dialog-content {
        padding: 24px;
        overflow-y: auto;
        max-height: 90dvh;
      }
      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .dialog-head h2 {
        margin: 0;
      }
      .dialog-head button {
        padding: 4px 10px;
        font-size: 21px;
      }
      #toast {
        position: fixed;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        border-radius: 14px;
        padding: 12px 17px;
        max-width: calc(100% - 30px);
        z-index: 20;
        box-shadow: 0 5px 25px #20243330;
        font-size: 13px;
      }
      #toast:empty {
        display: none;
      }
      #toast button {
        background: transparent;
        border: 0;
        color: #fff;
        text-decoration: underline;
        padding: 0 0 0 14px;
      }
      .login {
        max-width: 380px;
        margin: 12vh auto;
      }
      .login .brand {
        margin-bottom: 24px;
      }
      .version {
        font-size: 11px;
        color: var(--muted);
      }
      .trend {
        display: flex;
        align-items: end;
        height: 110px;
        gap: 10px;
      }
      .trend button {
        flex: 1;
        background: transparent;
        border: 0;
        padding: 0;
        font-size: 11px;
        color: var(--muted);
      }
      .trend span {
        display: block;
        background: #c8cff6;
        width: 70%;
        margin: auto;
        border-radius: 7px 7px 0 0;
      }
      .trend button.active span {
        background: var(--blue);
      }
      .footer-note {
        font-size: 12px;
        color: var(--muted);
        margin: 12px 0;
      }
      .breakdown {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .breakdown div {
        padding: 11px;
        background: #f7f7fb;
        border-radius: 12px;
      }
      .breakdown b {
        display: block;
      }
      .sticky-save {
        position: sticky;
        bottom: 78px;
        padding-top: 9px;
        background: #fff;
      }
      .intro {
        font-size: 14px;
      }
      .inline-link {
        border: 0;
        background: transparent;
        color: var(--blue);
        padding: 0;
        text-decoration: underline;
      }
      @media (max-width: 730px) {
        .wrap {
          padding: 18px 16px 95px;
        }
        .top {
          margin-bottom: 22px;
        }
        .shell {
          display: block;
        }
        .nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 10;
          background: #fff;
          border-top: 1px solid var(--line);
          flex-direction: row;
          padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
          justify-content: space-around;
        }
        .nav button {
          flex: 1;
          text-align: center;
          font-size: 13px;
          padding: 10px;
        }
        .nav small {
          display: none;
        }
        .columns {
          grid-template-columns: 1fr;
        }
        .card {
          padding: 18px;
          border-radius: 18px;
        }
        h1 {
          font-size: 27px;
        }
        .brand {
          font-size: 23px;
        }
        .top-right {
          gap: 8px;
        }
        .metrics.three {
          grid-template-columns: 1fr 1fr;
        }
        .metrics.three .metric:first-child {
          grid-column: 1/-1;
        }
        .metric b {
          font-size: 23px;
        }
        .toolbar {
          flex-wrap: wrap;
        }
        .toolbar select {
          width: 130px;
        }
        .breakdown {
          grid-template-columns: 1fr 1fr;
        }
        .hero .large {
          font-size: 33px;
        }
        .page-head {
          align-items: start;
        }
        .sticky-save {
          bottom: 74px;
        }
        .amount-field input {
          font-size: 36px;
        }
        .field {
          margin-bottom: 12px;
        }
        .nav button.active {
          border-radius: 12px;
        }
        .people label {
          padding: 10px;
        }
        .category-pills label {
          padding: 7px 3px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="wrap"><p>Loading Household…</p></div>
    </div>
    <dialog id="dialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script>
/* Household calendar and storage helpers. No network or database side effects. */
const TZ = "Pacific/Auckland";
const CATS = [
  { id: "housing", label: "Housing", icon: "⌂", noSplit: true },
  { id: "groceries", label: "Groceries", icon: "▧" },
  { id: "dining_fun", label: "Dining & Fun", icon: "✦" },
  { id: "bills", label: "Bills", icon: "≋" },
  { id: "subscriptions", label: "Subscriptions", icon: "↻" },
  { id: "other", label: "Other", icon: "⋯" },
];
const ALIASES = {
  rent: "housing",
  dining: "dining_fun",
  entertainment: "dining_fun",
  utilities: "bills",
  insurance: "bills",
  transport: "other",
  health: "other",
  shopping: "other",
};
const categoryOf = (id) =>
  CATS.find((c) => c.id === (ALIASES[id] || id)) || CATS[5];
function nzDate(value = new Date()) {
  if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value))
    return value;
  const d = new Date(value);
  if (!Number.isFinite(d.getTime())) return null;
  const p = Object.fromEntries(
    new Intl.DateTimeFormat("en-NZ", {
      timeZone: TZ,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    })
      .formatToParts(d)
      .map((x) => [x.type, x.value]),
  );
  return `${p.year}-${p.month}-${p.day}`;
}
function validDate(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return false;
  const d = new Date(s + "T12:00:00Z");
  return Number.isFinite(d.getTime()) && d.toISOString().slice(0, 10) === s;
}
function shiftDate(s, n) {
  const d = new Date(s + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function weekOf(s = nzDate()) {
  s = nzDate(s);
  const d = new Date(s + "T12:00:00Z");
  return shiftDate(s, -((d.getUTCDay() - 4 + 7) % 7));
}
function shiftMonth(s, n) {
  const [y, m] = s.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1 + n, 1, 12)).toISOString().slice(0, 7);
}
function daysInMonth(s) {
  const [y, m] = s.split("-").map(Number);
  return new Date(Date.UTC(y, m, 0)).getUTCDate();
}
const dateLabel = (s, options = { day: "numeric", month: "short" }) =>
  new Date(s + "T12:00:00Z").toLocaleDateString("en-NZ", {
    ...options,
    timeZone: "UTC",
  });
const monthLabel = (s) =>
  dateLabel(s + "-01", { month: "long", year: "numeric" });
const money = (cents) =>
  new Intl.NumberFormat("en-NZ", { style: "currency", currency: "NZD" }).format(
    cents / 100,
  );
function parseMoney(value, allowZero = false) {
  const s = String(value).trim();
  if (!/^(?:\d+|\d*\.\d{1,2})$/.test(s))
    throw new Error(
      "Enter a number with up to two decimal places, such as 92.50.",
    );
  const [whole, frac = ""] = s.split(".");
  const cents = Number(whole || 0) * 100 + Number(frac.padEnd(2, "0"));
  if (!Number.isSafeInteger(cents) || cents < 0 || (!allowZero && cents === 0))
    throw new Error("Enter an amount greater than zero.");
  return cents;
}
function records(value) {
  return Object.entries(value || {})
    .filter(([, r]) => r && typeof r === "object" && r.id)
    .map(([key, raw]) => ({
      ...raw,
      _key: key,
      _raw: raw,
      date: raw.date || nzDate(raw.ts),
      cents: Number.isSafeInteger(raw.cents)
        ? raw.cents
        : Math.round(Number(raw.amt || 0) * 100),
      category: categoryOf(raw.category).id,
    }))
    .sort(
      (a, b) =>
        (b.date || "").localeCompare(a.date || "") ||
        String(b.ts || "").localeCompare(String(a.ts || "")),
    );
}
const sum = (list) => list.reduce((n, r) => n + r.cents, 0);
function balanceOf(expenses, settlements) {
  // Keep half-cent precision until the final payable amount is rounded.
  const halfCents = expenses
    .filter((e) => !categoryOf(e.category).noSplit)
    .reduce((n, e) => n + (e.by === "p1" ? e.cents : -e.cents), 0);
  return (
    Math.round(halfCents / 2) +
    settlements.reduce((n, s) => n + (s.from === "p2" ? -s.cents : s.cents), 0)
  );
}
function incomeHistory(v) {
  if (!v) return [];
  if (v.amt !== undefined || v.cents !== undefined)
    return [{ ...v, from: "2000-01-01" }];
  return Object.values(v).filter(Boolean);
}
function rateAt(v, date) {
  return incomeHistory(v)
    .filter((r) => (nzDate(r.from) || "2000-01-01") <= date)
    .sort((a, b) => nzDate(b.from).localeCompare(nzDate(a.from)) || String(b.createdAt || b.from).localeCompare(String(a.createdAt || a.from)))[0];
}
function incomeForPeriod(income, start, end) {
  let total = 0;
  for (let d = start; d <= end; d = shiftDate(d, 1))
    for (const who of ["p1", "p2"]) {
      const r = rateAt(income[who], d);
      if (!r) continue;
      const c = Number.isSafeInteger(r.cents)
        ? r.cents
        : Math.round(r.amt * 100);
      total +=
        c /
        (r.freq === "weekly"
          ? 7
          : r.freq === "fortnightly"
            ? 14
            : daysInMonth(d.slice(0, 7)));
    }
  return Math.round(total);
}
function outlook(expenses, month, today = nzDate()) {
  const current = expenses.filter((e) => e.date?.startsWith(month));
  const fixed = current.filter((e) => e.frequency && e.frequency !== "once");
  const variable = current.filter(
    (e) => !e.frequency || e.frequency === "once",
  );
  const elapsed =
    month === today.slice(0, 7) ? Number(today.slice(8)) : daysInMonth(month);
  // Repeats are not multiplied by the number of days; this is only a variable-spend estimate.
  return {
    fixed: sum(fixed),
    variable: sum(variable),
    forecast:
      sum(fixed) + Math.round((sum(variable) / elapsed) * daysInMonth(month)),
    elapsed,
  };
}
function suggestedBudgets(expenses, month) {
  const months = [1, 2, 3]
    .map((n) => shiftMonth(month, -n))
    .filter((m) => expenses.some((e) => e.date?.startsWith(m)));

    CATS.map((c) => [
      c.id,
      Math.ceil(
        sum(
          expenses.filter(

        ) /

            errorBox +
            '<p class="muted small">A monthly target for surprise costs. It is included in your spending, not deducted again.</p><div class="field"><label for="buffer-amt">Target (NZD)</label><input id="buffer-amt" name="amt" inputmode="decimal" value="' +
            (state.data.buffer?.amt || "") +
            '" required></div><div class="form-actions"><button type="button" class="danger" id="remove-buffer">Remove</button><button type="submit" class="primary">Save target</button></div></form>',
          () => {
            const form = document.getElementById("buffer-form");
            form.onsubmit = (e) => {
              e.preventDefault();
              runSave(
                form,
                () => {
                  const cents = parseMoney(form.elements.amt.value, true);
                  return writeSetting("buffer", { amt: cents / 100, cents });
                },
                () => {
                  dialog.close();
                  toast("Buffer saved.");
                },
              );
            };
            document.getElementById("remove-buffer").onclick = () =>
              runSave(
                form,
                () => writeSetting("buffer", null),
                () => {
                  dialog.close();
                  toast("Buffer removed.");
                },
              );
          },
        );
      }
      function download(filename, text, type) {
        const url = URL.createObjectURL(new Blob([text], { type })),
          a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      function exportCSV() {
        const rows = [
          [
            "Type",
            "Date",
            "Amount NZD",
            "Category",
            "Description",
            "Person",
            "To",
            "Frequency",
            "Unexpected",
            "Note",
          ],
        ];
        for (const e of exps())
          rows.push([
            "Expense",
            e.date,
            (e.cents / 100).toFixed(2),
            categoryOf(e.category).label,
            e.where,
            name(e.by),
            "",
            e.frequency || "once",
            e.unexpected ? "yes" : "no",
            e.note || "",
          ]);
        for (const s of settles())
          rows.push([
            "Payment",
            s.date,
            (s.cents / 100).toFixed(2),
            "",
            "",
            name(s.from),
            name(s.to),
            "",
            "",
            "",
          ]);
        for (const s of sides())
          rows.push([
            "Side income",
            s.date,
            (s.cents / 100).toFixed(2),
            "",
            s.note || "",
            name(s.by),
            "",
            "",
            "",
            "",
          ]);
        const csv = rows
          .map((row) =>
            row
              .map((v) => {
                let s = String(v);
                if (/^[=+@-]/.test(s)) s = "'" + s;
                return '"' + s.replaceAll('"', '""') + '"';
              })
              .join(","),
          )
          .join("\r\n");
        download(
          "household-" + nzDate() + ".csv",
          "\uFEFF" + csv,
          "text/csv;charset=utf-8",
        );
      }
      function settingsModal() {
        openModal(
          "Settings & exports",
          '<form id="names-form">' +
            errorBox +
            '<div class="fields">' +
            ["p1", "p2"]
              .map(
                (w) =>
                  '<div><label for="name-' +
                  w +
                  '">' +
                  (w === "p1" ? "First" : "Second") +
                  ' person</label><input id="name-' +
                  w +
                  '" name="' +
                  w +
                  '" value="' +
                  esc(name(w)) +
                  '" maxlength="50" required></div>',
              )
              .join("") +
            '</div><button class="primary wide" type="submit">Save names</button></form><div class="list-row"><button id="csv">Export CSV</button><button id="backup">Full JSON backup</button></div><p class="footer-note">JSON includes income history, targets, payments and all original records.</p><p class="notice">Use this version on both devices. Older versions save whole collections and can overwrite newer entries.</p><div class="list-row"><span class="grow small muted">' +
            esc(state.user.email || "") +
            '</span><button id="signout">Sign out</button></div><p class="version">Household 3.0 · NZ dates · record-level saves</p>',
          () => {
            const form = document.getElementById("names-form");
            form.onsubmit = (e) => {
              e.preventDefault();
              runSave(
                form,
                async () => {
                  const f = new FormData(form),
                    patch = {};
                  for (const w of ["p1", "p2"]) {
                    const v = String(f.get(w)).trim();
                    if (!v) throw new Error("Enter both names.");
                    if (v !== name(w)) patch["names/" + w] = v;
                  }
                  if (Object.keys(patch).length)
                    await db.ref(PATH).update(patch);
                },
                () => {
                  dialog.close();
                  toast("Names saved.");
                },
              );
            };
            document.getElementById("csv").onclick = exportCSV;
            document.getElementById("backup").onclick = () =>
              download(
                "household-backup-" + nzDate() + ".json",
                JSON.stringify(state.data, null, 2),
                "application/json",
              );
            document.getElementById("signout").onclick = async () => {
              try {
                await auth.signOut();
                dialog.close();
              } catch {
                toast("Could not sign out. Try again.");
              }
            };
          },
        );
      }
      function renderLogin() {
        root.innerHTML =
          '<div class="wrap"><section class="card login"><div class="brand">house<span>hold</span></div><h1>Welcome back</h1><p class="muted">Your shared expenses, in one place.</p><form id="login-form">' +
          errorBox +
          '<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="primary wide" type="submit">Sign in</button></form><p class="footer-note">Household 3.0 · Same account and existing records.</p></section></div>';
        const form = document.getElementById("login-form");
        form.onsubmit = async (e) => {
          e.preventDefault();
          const button = form.querySelector("button"),
            err = form.querySelector(".error");
          button.disabled = true;
          button.textContent = "Signing in…";
          err.textContent = "";
          try {
            await auth.signInWithEmailAndPassword(
              form.elements.email.value.trim(),
              form.elements.password.value,
            );
          } catch (e) {
            err.textContent =
              e.code === "auth/too-many-requests"
                ? "Too many attempts. Wait a little and try again."
                : e.code === "auth/network-request-failed"
                  ? "Check your connection and try again."
                  : "Could not sign in. Check your email and password.";
            button.disabled = false;
            button.textContent = "Sign in";
          }
        };
      }
      try {
        firebase.initializeApp(CONFIG);
        auth = firebase.auth();
        db = firebase.database();
        auth
          .setPersistence(firebase.auth.Auth.Persistence.LOCAL)
          .catch(() => toast("Your browser may not keep you signed in."));
        db.ref(".info/connected").on("value", (s) => {
          connected = !!s.val();
          updateStatus();
        });
        auth.onAuthStateChanged(
          (user) => {
            if (unsubscribe) unsubscribe();
            state.user = user;
            state.data = {};
            state.ready = false;
            state.loading = !!user;
            state.error = "";
            state.draft = blankExpense();
            if (user) {
              const ref = db.ref(PATH);
              const onValue = (s) => {
                state.data = s.val() || {};
                state.loading = false;
                state.ready = true;
                state.error = ""; // Preserve in-progress forms when a partner saves.
                if (!state.saving && !dialog.open) {
                  const f = document.getElementById("add-form");
                  if (f) rememberDraft(f);
                  render();
                }
              };
              ref.on("value", onValue, (e) => {
                state.error =
                  e.code === "PERMISSION_DENIED"
                    ? "Your account cannot access this household. Check Firebase access rules."
                    : "Check your connection and try again.";
                state.loading = false;
                state.ready = false;
                render();
              });
              unsubscribe = () => ref.off("value", onValue);
            }
            render();
          },
          () => {
            root.innerHTML =
              '<div class="wrap"><p>Could not check sign-in. Reload to try again.</p></div>';
          },
        );
      } catch (e) {
        root.innerHTML =
          '<div class="wrap"><section class="card"><h1>Could not start Household</h1><p>Check your internet connection, then reload. The Firebase sign-in libraries need a connection.</p><button onclick="location.reload()">Retry</button></section></div>';
      }
    </script>
  </body>
</html>
